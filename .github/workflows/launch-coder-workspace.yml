name: Launch Coder Workspace

on:
  workflow_dispatch:
    inputs:
      workspace_name:
        description: "Unique workspace name"
        required: true
        type: string
      template_entity:
        description: "Port template entity (JSON or identifier)"
        required: true
        type: string
      team:
        description: "Team name"
        required: true
        type: string
      port_run_id:
        description: "Port action run ID"
        required: true
        type: string
      triggered_by:
        description: "Email of triggering user"
        required: false
        type: string

jobs:
  launch-coder-workspace:
    name: Launch Coder Workspace
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # ── 1. Notify Port ────────────────────────────────────────────────────
      - name: Notify Port - In Progress
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          logMessage: "Resolving template for workspace '${{ inputs.workspace_name }}'..."

      # ── 2. Fetch template entity from Port ────────────────────────────────
      - name: Fetch Template entity from Port
        id: fetch_template
        shell: python3 {0}
        env:
          ENTITY_RAW: ${{ inputs.template_entity }}
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
        run: |
          import json, os, sys, urllib.request

          client_id     = os.environ["PORT_CLIENT_ID"]
          client_secret = os.environ["PORT_CLIENT_SECRET"]
          entity_raw    = os.environ["ENTITY_RAW"]
          base_url      = "https://api.getport.io/v1"

          # Port may pass the full entity object or just the identifier
          try:
              entity_obj = json.loads(entity_raw)
              entity_id  = entity_obj.get("identifier", entity_raw)
          except (json.JSONDecodeError, AttributeError):
              entity_id  = entity_raw.strip()

          auth_payload = json.dumps({"clientId": client_id, "clientSecret": client_secret}).encode()
          req = urllib.request.Request(
              f"{base_url}/auth/access_token",
              data=auth_payload,
              headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req) as r:
              token = json.loads(r.read())["accessToken"]

          req2 = urllib.request.Request(
              f"{base_url}/blueprints/coder_template/entities/{entity_id}",
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
          with urllib.request.urlopen(req2) as r:
              data = json.loads(r.read())

          props         = data["entity"]["properties"]
          template_name = props["template_name"]
          namespace     = props["namespace"]
          ttl_days      = props.get("ttl_days", 1)
          status        = props.get("status", "")

          print(f"Resolved: template={template_name} namespace={namespace} ttl_days={ttl_days} status={status}")

          if status != "READY":
              print(f"::error::Template status is '{status}' — only READY templates can be used.")
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"template_name={template_name}\n")
              f.write(f"namespace={namespace}\n")
              f.write(f"ttl_days={ttl_days}\n")
              f.write(f"entity_id={entity_id}\n")

      # ── 3. Install Coder CLI ──────────────────────────────────────────────
      - name: Install Coder CLI
        run: |
          curl -fsSL https://coder.com/install.sh | sh
          coder version

      # ── 4. Create workspace ───────────────────────────────────────────────
      - name: Create Coder Workspace
        id: create_workspace
        env:
          CODER_URL: ${{ secrets.CODER_URL }}
          CODER_TOKEN: ${{ secrets.CODER_TOKEN }}
          CODER_SESSION_TOKEN: ${{ secrets.CODER_TOKEN }}
        run: |
          set -euo pipefail

          # Explicitly authenticate the Coder CLI
          coder login "${{ secrets.CODER_URL }}" --token "${{ secrets.CODER_TOKEN }}"

          TEMPLATE="${{ steps.fetch_template.outputs.template_name }}"
          WS_NAME="${{ inputs.workspace_name }}"

          coder create "$WS_NAME" \
            --template="$TEMPLATE" \
            --yes

          # Get workspace URL
          WS_URL="${{ secrets.CODER_URL }}/@${{ inputs.triggered_by }}/${WS_NAME}"
          WS_ID=$(coder show "$WS_NAME" --output json 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")

          echo "workspace_url=$WS_URL" >> $GITHUB_OUTPUT
          echo "workspace_id=$WS_ID" >> $GITHUB_OUTPUT
          echo "Workspace created: $WS_URL"

      # ── 5. Create Port entity ─────────────────────────────────────────────
      - name: Create Port Workspace Entity
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: UPSERT
          identifier: ${{ inputs.workspace_name }}
          title: ${{ inputs.workspace_name }}
          blueprint: coder_workspace
          runId: ${{ inputs.port_run_id }}
          relations: |-
            {
              "template": "${{ steps.fetch_template.outputs.entity_id }}"
            }
          properties: |-
            {
              "workspace_name": "${{ inputs.workspace_name }}",
              "workspace_url": "${{ steps.create_workspace.outputs.workspace_url }}",
              "status": "RUNNING",
              "owner": "${{ inputs.triggered_by }}",
              "team": "${{ inputs.team }}",
              "ttl_days": ${{ steps.fetch_template.outputs.ttl_days }},
              "namespace": "${{ steps.fetch_template.outputs.namespace }}",
              "workspace_id": "${{ steps.create_workspace.outputs.workspace_id }}"
            }

      # ── 6. Notify success ─────────────────────────────────────────────────
      - name: Notify Port - Success
        if: success()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          status: "SUCCESS"
          logMessage: "✅ Workspace '${{ inputs.workspace_name }}' is running. URL: ${{ steps.create_workspace.outputs.workspace_url }}"

      # ── 7. Notify failure ─────────────────────────────────────────────────
      - name: Notify Port - Failure
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          status: "FAILURE"
          logMessage: "❌ Failed to launch workspace '${{ inputs.workspace_name }}'. Check Actions logs."
