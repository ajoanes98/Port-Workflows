name: Build Workstation Dockerfile

on:
  workflow_dispatch:
    inputs:
      dockerfile_name:
        description: "Unique name for the Dockerfile / image"
        required: true
        type: string
      base_image:
        description: "Base Docker image"
        required: true
        type: string
      tools:
        description: "JSON array of tools to install"
        required: false
        default: "[]"
        type: string
      node_version:
        description: "Node.js version"
        required: false
        default: "20"
        type: string
      python_version:
        description: "Python version"
        required: false
        default: "3.12"
        type: string
      java_distro:
        description: "Java distribution"
        required: false
        default: "eclipse-temurin"
        type: string
      terraform_version:
        description: "Terraform version"
        required: false
        default: "latest"
        type: string
      artifact_registry_region:
        description: "Artifact Registry region"
        required: true
        type: string
      artifact_registry_repo:
        description: "Artifact Registry repository name"
        required: true
        type: string
      port_run_id:
        description: "Port action run ID"
        required: true
        type: string
      triggered_by:
        description: "Email of triggering user"
        required: false
        type: string

jobs:
  build-and-push:
    name: Generate Dockerfile & Push to Artifact Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Notify Port - In Progress
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          logMessage: "Starting Dockerfile build for '${{ inputs.dockerfile_name }}'..."

      - name: Parse tools
        id: tools
        if: always()
        shell: python3 {0}
        run: |
          import json, os
          raw = '${{ inputs.tools }}'.strip()
          try:
              parsed = json.loads(raw)
              if not isinstance(parsed, list):
                  parsed = []
          except Exception:
              parsed = []
          csv  = ','.join(parsed)
          jarr = json.dumps(parsed)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'csv={csv}\n')
              f.write(f'json={jarr}\n')
          print(f'Tools CSV : {csv}')
          print(f'Tools JSON: {jarr}')

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ inputs.artifact_registry_region }}-docker.pkg.dev --quiet
          gcloud auth configure-docker gcr.io --quiet

      - name: Ensure Artifact Registry repository exists
        run: |
          REPO="${{ inputs.artifact_registry_repo }}"
          REGION="${{ inputs.artifact_registry_region }}"
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"
          if gcloud artifacts repositories describe "$REPO" \
              --location="$REGION" --project="$PROJECT" \
              --format="value(name)" 2>/dev/null; then
            echo "Repository '$REPO' already exists."
          else
            echo "Creating repository '$REPO'..."
            gcloud artifacts repositories create "$REPO" \
              --repository-format=docker \
              --location="$REGION" \
              --project="$PROJECT" \
              --description="GCP Workstation images managed by Port"
            echo "Repository created."
          fi

      - name: Generate Dockerfile
        id: generate
        run: |
          set -euo pipefail
          TOOLS="${{ steps.tools.outputs.csv }}"
          BASE_IMAGE="${{ inputs.base_image }}"
          NODE_VER="${{ inputs.node_version }}"
          PY_VER="${{ inputs.python_version }}"
          TF_VER="${{ inputs.terraform_version }}"

          echo "FROM ${BASE_IMAGE}" > Dockerfile
          echo 'LABEL maintainer="platform-engineering"' >> Dockerfile
          echo "LABEL tools=\"${TOOLS}\"" >> Dockerfile
          echo 'ENV DEBIAN_FRONTEND=noninteractive' >> Dockerfile
          cat >> Dockerfile << 'BASEBLOCK'
          RUN apt-get update && apt-get install -y --no-install-recommends \
              curl wget ca-certificates gnupg lsb-release unzip zip \
              build-essential software-properties-common apt-transport-https \
              && rm -rf /var/lib/apt/lists/*
          BASEBLOCK

          if echo "$TOOLS" | grep -q "git-github-cli"; then
            cat >> Dockerfile << 'BLOCK'
          RUN apt-get update && apt-get install -y --no-install-recommends git && \
              curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
                | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg && \
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
                | tee /etc/apt/sources.list.d/github-cli.list && \
              apt-get update && apt-get install -y gh && rm -rf /var/lib/apt/lists/*
          BLOCK
          fi

          if echo "$TOOLS" | grep -q "nodejs"; then
            echo "RUN curl -fsSL https://deb.nodesource.com/setup_${NODE_VER}.x | bash - && apt-get install -y nodejs && rm -rf /var/lib/apt/lists/*" >> Dockerfile
          fi

          if echo "$TOOLS" | grep -q "python3"; then
            echo "RUN add-apt-repository ppa:deadsnakes/ppa -y && apt-get update && apt-get install -y python${PY_VER} python${PY_VER}-venv python${PY_VER}-dev python3-pip && update-alternatives --install /usr/bin/python3 python3 /usr/bin/python${PY_VER} 1 && rm -rf /var/lib/apt/lists/*" >> Dockerfile
          fi

          if echo "$TOOLS" | grep -q "java17"; then
            cat >> Dockerfile << 'BLOCK'
          RUN apt-get update && apt-get install -y wget apt-transport-https && \
              mkdir -p /etc/apt/keyrings && \
              wget -O - https://packages.adoptium.net/artifactory/api/gpg/key/public | tee /etc/apt/keyrings/adoptium.asc && \
              echo "deb [signed-by=/etc/apt/keyrings/adoptium.asc] https://packages.adoptium.net/artifactory/deb $(lsb_release -cs) main" \
                | tee /etc/apt/sources.list.d/adoptium.list && \
              apt-get update && apt-get install -y temurin-17-jdk && rm -rf /var/lib/apt/lists/*
          ENV JAVA_HOME=/usr/lib/jvm/temurin-17-amd64
          ENV PATH=$JAVA_HOME/bin:$PATH
          BLOCK
          fi

          if echo "$TOOLS" | grep -q "docker-in-docker"; then
            cat >> Dockerfile << 'BLOCK'
          RUN curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
                | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg && \
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
                | tee /etc/apt/sources.list.d/docker.list && \
              apt-get update && apt-get install -y docker-ce-cli docker-buildx-plugin && rm -rf /var/lib/apt/lists/*
          BLOCK
          fi

          if echo "$TOOLS" | grep -q "kubectl"; then
            cat >> Dockerfile << 'BLOCK'
          RUN curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key \
                | gpg --dearmor -o /usr/share/keyrings/kubernetes-apt-keyring.gpg && \
              echo "deb [signed-by=/usr/share/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /" \
                | tee /etc/apt/sources.list.d/kubernetes.list && \
              apt-get update && apt-get install -y kubectl && rm -rf /var/lib/apt/lists/*
          BLOCK
          fi

          if echo "$TOOLS" | grep -q "terraform"; then
            cat >> Dockerfile << 'BLOCK'
          RUN wget -O- https://apt.releases.hashicorp.com/gpg \
                | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg && \
              echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
                | tee /etc/apt/sources.list.d/hashicorp.list && \
              apt-get update && apt-get install -y terraform && rm -rf /var/lib/apt/lists/*
          BLOCK
          fi

          if echo "$TOOLS" | grep -q "gcloud-cli"; then
            cat >> Dockerfile << 'BLOCK'
          RUN echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" \
                | tee /etc/apt/sources.list.d/google-cloud-sdk.list && \
              curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg \
                | gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg && \
              apt-get update && apt-get install -y google-cloud-cli && rm -rf /var/lib/apt/lists/*
          BLOCK
          fi

          if echo "$TOOLS" | grep -q "vscode-server"; then
            cat >> Dockerfile << 'BLOCK'
          RUN curl -fsSL https://code-server.dev/install.sh | sh
          EXPOSE 8080
          BLOCK
          fi

          cat >> Dockerfile << 'BLOCK'
          RUN useradd -m -s /bin/bash developer && \
              echo "developer ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
          USER developer
          WORKDIR /home/developer
          CMD ["/bin/bash"]
          BLOCK

          echo "=== Generated Dockerfile ==="
          cat Dockerfile

      - name: Build and Push Docker Image
        id: docker_build
        run: |
          set -euo pipefail
          REGISTRY="${{ inputs.artifact_registry_region }}-docker.pkg.dev"
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"
          REPO="${{ inputs.artifact_registry_repo }}"
          IMAGE_NAME="${{ inputs.dockerfile_name }}"
          TAG="$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          FULL_IMAGE="${REGISTRY}/${PROJECT}/${REPO}/${IMAGE_NAME}:${TAG}"
          LATEST_IMAGE="${REGISTRY}/${PROJECT}/${REPO}/${IMAGE_NAME}:latest"
          docker build --tag "$FULL_IMAGE" --tag "$LATEST_IMAGE" \
            --label "built-by=port-self-service" .
          docker push "$FULL_IMAGE"
          docker push "$LATEST_IMAGE"
          echo "full_image=$FULL_IMAGE" >> $GITHUB_OUTPUT
          echo "registry_path=$FULL_IMAGE" >> $GITHUB_OUTPUT

      - name: Create Port Dockerfile Entity
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: UPSERT
          identifier: ${{ inputs.dockerfile_name }}
          title: ${{ inputs.dockerfile_name }}
          blueprint: gcp_dockerfile
          runId: ${{ inputs.port_run_id }}
          properties: |-
            {
              "tools": ${{ steps.tools.outputs.json }},
              "base_image": "${{ inputs.base_image }}",
              "registry_path": "${{ steps.docker_build.outputs.registry_path }}",
              "dockerfile_content": "Built from: ${{ inputs.base_image }} | Tools: ${{ steps.tools.outputs.csv }}",
              "build_status": "SUCCESS",
              "created_by": "${{ inputs.triggered_by }}"
            }

      - name: Notify Port - Success
        if: success()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          status: "SUCCESS"
          logMessage: "✅ Image ${{ steps.docker_build.outputs.full_image }} built and pushed. Tools: ${{ steps.tools.outputs.csv }}"

      - name: Mark Entity Failed
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: UPSERT
          identifier: ${{ inputs.dockerfile_name }}
          blueprint: gcp_dockerfile
          runId: ${{ inputs.port_run_id }}
          properties: |-
            {
              "build_status": "FAILED",
              "tools": ${{ steps.tools.outputs.json }},
              "base_image": "${{ inputs.base_image }}"
            }

      - name: Notify Port - Failure
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          status: "FAILURE"
          logMessage: "❌ Dockerfile build failed for '${{ inputs.dockerfile_name }}'. Check Actions logs."
