name: Auto-Scale EC2 for Service

on:
  workflow_dispatch:
    inputs:
      service_identifier:
        description: 'Port service identifier'
        required: true
        type: string
      scale_direction:
        description: 'scale_up or scale_down'
        required: true
        type: string
      avg_cpu_utilization:
        description: 'Current average CPU utilization (for logging)'
        required: false
        type: string
      port_run_id:
        description: 'Port workflow run ID for status reporting'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  scale-ec2:
    runs-on: ubuntu-latest
    steps:
      - name: Report starting to Port
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.port.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          logMessage: |
            🚀 Starting ${{ inputs.scale_direction }} for service: ${{ inputs.service_identifier }}
            Current avg CPU: ${{ inputs.avg_cpu_utilization }}%

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Scale EC2 Auto Scaling Group
        id: scale_asg
        run: |
          DIRECTION="${{ inputs.scale_direction }}"

          ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
            --filters "Name=tag:Service,Values=${{ inputs.service_identifier }}" \
            --query 'AutoScalingGroups[0].AutoScalingGroupName' \
            --output text)

          if [ "$ASG_NAME" == "None" ] || [ -z "$ASG_NAME" ]; then
            echo "::error::No Auto Scaling Group found with tag Service=${{ inputs.service_identifier }}"
            exit 1
          fi

          CURRENT=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].DesiredCapacity' --output text)
          MAX=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].MaxSize' --output text)
          MIN=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].MinSize' --output text)

          if [ "$DIRECTION" == "scale_up" ]; then
            NEW=$(( CURRENT + 1 ))
            if [ $NEW -gt $MAX ]; then NEW=$MAX; fi
          else
            NEW=$(( CURRENT - 1 ))
            if [ $NEW -lt $MIN ]; then NEW=$MIN; fi
          fi

          echo "Scaling $ASG_NAME from $CURRENT to $NEW (direction: $DIRECTION)"
          aws autoscaling set-desired-capacity \
            --auto-scaling-group-name "$ASG_NAME" \
            --desired-capacity $NEW

          echo "new_capacity=$NEW" >> $GITHUB_OUTPUT
          echo "asg_name=$ASG_NAME" >> $GITHUB_OUTPUT

      - name: Report completion to Port
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.port.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          logMessage: |
            ✅ Scaled ASG: ${{ steps.scale_asg.outputs.asg_name }}
            New desired capacity: ${{ steps.scale_asg.outputs.new_capacity }}
            Port scorecard will refresh on next AWS integration sync.
          status: SUCCESS
