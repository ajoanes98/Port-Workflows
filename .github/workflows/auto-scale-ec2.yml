# Auto-scale EC2 (Port self-healing backend)
#
# Dispatched by Port workflow `cpu_utilization_self_healing`
# via github-ocean `dispatch_workflow` when a cloud resource's
# cpu_utilization_health scorecard degrades.
#
# Copy to: .github/workflows/auto-scale-ec2.yml in your workflows repo.
# Secrets: PORT_CLIENT_ID, PORT_CLIENT_SECRET (EU org → api.eu.getport.io)
#
# Replace the [SIM] steps with real ASG / EC2 API calls for production.

name: Auto-Scale EC2 for Cloud Resource (Simulated)

on:
  workflow_dispatch:
    inputs:
      port_run_id:
        description: Port workflow run ID for status reporting
        required: true
        type: string
      scale_direction:
        description: scale_up or scale_down
        required: true
        type: string
      cloud_resource_identifier:
        description: Port cloudResource entity identifier to scale
        required: true
        type: string
      service_identifier:
        description: Related service (from used_by), if any
        required: false
        type: string
      cpu_utilization:
        description: CPU utilization that triggered the run
        required: false
        type: string

permissions:
  contents: read

env:
  # EU Port org (scorecardsWorkshop3). Use https://api.port.io for US orgs.
  PORT_API_BASE: https://api.eu.getport.io

jobs:
  scale-ec2:
    runs-on: ubuntu-latest
    steps:
      - name: Report starting to Port
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: ${{ env.PORT_API_BASE }}
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          logMessage: |
            🚀 [SIMULATED] Starting ${{ inputs.scale_direction }} for cloud resource: ${{ inputs.cloud_resource_identifier }}
            Related service: ${{ inputs.service_identifier }}
            Current CPU: ${{ inputs.cpu_utilization }}%

      # ── SIMULATED AWS STEP ─────────────────────────────────────────
      - name: "[SIM] Find Auto Scaling Group"
        id: find_asg
        run: |
          echo "🔍 [SIM] Querying ASG for resource=${{ inputs.cloud_resource_identifier }} service=${{ inputs.service_identifier }}"
          echo "asg_name=sim-asg-${{ inputs.cloud_resource_identifier }}" >> $GITHUB_OUTPUT
          echo "current_capacity=2" >> $GITHUB_OUTPUT
          echo "max_capacity=6" >> $GITHUB_OUTPUT
          echo "min_capacity=1" >> $GITHUB_OUTPUT

      - name: "[SIM] Scale Auto Scaling Group"
        id: scale_asg
        run: |
          DIRECTION="${{ inputs.scale_direction }}"
          CURRENT=${{ steps.find_asg.outputs.current_capacity }}

          if [ "$DIRECTION" == "scale_up" ]; then
            NEW=$(( CURRENT + 1 ))
            echo "⬆️  [SIM] Scaling UP: ${{ steps.find_asg.outputs.asg_name }} from $CURRENT → $NEW"
          else
            NEW=$(( CURRENT - 1 ))
            echo "⬇️  [SIM] Scaling DOWN: ${{ steps.find_asg.outputs.asg_name }} from $CURRENT → $NEW"
          fi

          echo "new_capacity=$NEW" >> $GITHUB_OUTPUT
          echo "asg_name=${{ steps.find_asg.outputs.asg_name }}" >> $GITHUB_OUTPUT
      # ── END SIMULATED AWS STEP ─────────────────────────────────────

      # ── REAL: Push updated CPU back to Port to close the feedback loop
      - name: Get Port access token
        id: port_token
        run: |
          TOKEN=$(curl -s -X POST "${PORT_API_BASE}/v1/auth/access_token" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"$PORT_CLIENT_ID\",\"clientSecret\":\"$PORT_CLIENT_SECRET\"}" \
            | jq -r '.accessToken')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
        env:
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}

      - name: Update cpu_utilization on the triggering cloud resource in Port
        run: |
          # After a scale_up we simulate CPU dropping back to healthy (55%)
          # After a scale_down we simulate CPU rising back to healthy (40%)
          if [ "${{ inputs.scale_direction }}" == "scale_up" ]; then
            NEW_CPU=55
          else
            NEW_CPU=40
          fi

          RESOURCE="${{ inputs.cloud_resource_identifier }}"
          echo "📊 [SIM] Reporting recovered CPU: ${NEW_CPU}% for ${RESOURCE}"

          curl -s -X PATCH \
            "${PORT_API_BASE}/v1/blueprints/cloudResource/entities/${RESOURCE}" \
            -H "Authorization: Bearer ${{ steps.port_token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "{\"properties\": {\"cpu_utilization\": ${NEW_CPU}}}"

      - name: Report completion to Port
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: ${{ env.PORT_API_BASE }}
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          logMessage: |
            ✅ [SIMULATED] Scaling complete!
            Resource: ${{ inputs.cloud_resource_identifier }}
            ASG: ${{ steps.scale_asg.outputs.asg_name }}
            New desired capacity: ${{ steps.scale_asg.outputs.new_capacity }}
            CPU reset to healthy range → scorecard will recover to Gold on next sync.
          status: SUCCESS
