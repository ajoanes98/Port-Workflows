name: Auto-Scale EC2 for Service (Simulated)

on:
  workflow_dispatch:
    inputs:
      service_identifier:
        description: 'Port service identifier'
        required: true
        type: string
      scale_direction:
        description: 'scale_up or scale_down'
        required: true
        type: string
      avg_cpu_utilization:
        description: 'Current average CPU utilization (for logging)'
        required: false
        type: string
      port_run_id:
        description: 'Port workflow run ID for status reporting'
        required: true
        type: string

permissions:
  contents: read

jobs:
  scale-ec2:
    runs-on: ubuntu-latest
    steps:
      - name: Report starting to Port
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.port.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          logMessage: |
            🚀 [SIMULATED] Starting ${{ inputs.scale_direction }} for service: ${{ inputs.service_identifier }}
            Current avg CPU: ${{ inputs.avg_cpu_utilization }}%

      # ── SIMULATED AWS STEP ─────────────────────────────────────────
      - name: "[SIM] Find Auto Scaling Group"
        id: find_asg
        run: |
          echo "🔍 [SIM] Querying ASG with tag Service=${{ inputs.service_identifier }}"
          echo "asg_name=sim-asg-${{ inputs.service_identifier }}" >> $GITHUB_OUTPUT
          echo "current_capacity=2" >> $GITHUB_OUTPUT
          echo "max_capacity=6" >> $GITHUB_OUTPUT
          echo "min_capacity=1" >> $GITHUB_OUTPUT

      - name: "[SIM] Scale Auto Scaling Group"
        id: scale_asg
        run: |
          DIRECTION="${{ inputs.scale_direction }}"
          CURRENT=${{ steps.find_asg.outputs.current_capacity }}

          if [ "$DIRECTION" == "scale_up" ]; then
            NEW=$(( CURRENT + 1 ))
            echo "⬆️  [SIM] Scaling UP: ${{ steps.find_asg.outputs.asg_name }} from $CURRENT → $NEW"
          else
            NEW=$(( CURRENT - 1 ))
            echo "⬇️  [SIM] Scaling DOWN: ${{ steps.find_asg.outputs.asg_name }} from $CURRENT → $NEW"
          fi

          echo "new_capacity=$NEW" >> $GITHUB_OUTPUT
          echo "asg_name=${{ steps.find_asg.outputs.asg_name }}" >> $GITHUB_OUTPUT
      # ── END SIMULATED AWS STEP ─────────────────────────────────────

      # ── REAL: Push updated CPU back to Port to close the feedback loop
      - name: Get Port access token
        id: port_token
        run: |
          TOKEN=$(curl -s -X POST https://api.port.io/v1/auth/access_token \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"$PORT_CLIENT_ID\",\"clientSecret\":\"$PORT_CLIENT_SECRET\"}" \
            | jq -r '.accessToken')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
        env:
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}

      - name: Update cpu_utilization on simulated cloud resource in Port
        run: |
          # After a scale_up we simulate CPU dropping back to healthy (55%)
          # After a scale_down we simulate CPU rising back to healthy (40%)
          if [ "${{ inputs.scale_direction }}" == "scale_up" ]; then
            NEW_CPU=55
          else
            NEW_CPU=40
          fi

          echo "📊 [SIM] Reporting recovered CPU: ${NEW_CPU}% back to Port"

          curl -s -X PATCH \
            "https://api.port.io/v1/blueprints/cloudResource/entities/sim-ec2-ads-001" \
            -H "Authorization: Bearer ${{ steps.port_token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "{\"properties\": {\"cpu_utilization\": ${NEW_CPU}}}"

      - name: Report completion to Port
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.port.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          logMessage: |
            ✅ [SIMULATED] Scaling complete!
            ASG: ${{ steps.scale_asg.outputs.asg_name }}
            New desired capacity: ${{ steps.scale_asg.outputs.new_capacity }}
            CPU reset to healthy range → scorecard will recover to Gold on next sync.
          status: SUCCESS
