#workflow for Meijer Demo
name: Container Scan

on:
  workflow_dispatch:
    inputs:
      service_identifier:
        description: "Port service identifier"
        required: true
        type: string
      image_tag:
        description: "Docker image tag to scan"
        required: true
        type: string
        default: "latest"
      port_context:
        description: "Port run ID for status reporting"
        required: true
        type: string

jobs:
  scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    env:
      PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
      PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}

    steps:
      - name: Report scan started
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_context }}
          logMessage: "🔍 Starting Trivy scan for ${{ inputs.service_identifier }}:${{ inputs.image_tag }}..."

      # ------------------------------------------------------------------ #
      # Pull image from ACR
      # ------------------------------------------------------------------ #
      - name: Pull image from registry
        run: |
          echo "Pulling meijeracr.azurecr.io/${{ inputs.service_identifier }}:${{ inputs.image_tag }}"
          # az acr login --name meijeracr
          # docker pull meijeracr.azurecr.io/${{ inputs.service_identifier }}:${{ inputs.image_tag }}
          # For demo: use a public image as a stand-in
          docker pull node:20-alpine
          docker tag node:20-alpine ${{ inputs.service_identifier }}:${{ inputs.image_tag }}

      # ------------------------------------------------------------------ #
      # Run Trivy scan and output JSON
      # ------------------------------------------------------------------ #
      - name: Run Trivy vulnerability scan
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ inputs.service_identifier }}:${{ inputs.image_tag }}"
          format: "json"
          output: "trivy-results.json"
          ignore-unfixed: false
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"

      - name: Parse Trivy results
        id: parse
        run: |
          CRITICAL=$(cat trivy-results.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length')
          HIGH=$(cat trivy-results.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length')
          MEDIUM=$(cat trivy-results.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length')
          LOW=$(cat trivy-results.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "LOW")] | length')
          FIXABLE=$(cat trivy-results.json | jq '[.Results[]?.Vulnerabilities[]? | select(.FixedVersion != null and .FixedVersion != "")] | length')
          OS_PKGS=$(cat trivy-results.json | jq '[.Results[]? | select(.Type == "alpine" or .Type == "debian" or .Type == "ubuntu" or .Type == "redhat")] | length')
          DIGEST=$(cat trivy-results.json | jq -r '.ArtifactName // "unknown"')
          SCANNER_VER=$(cat trivy-results.json | jq -r '.SchemaVersion | tostring')

          PASSED="true"
          if [ "$CRITICAL" -gt 0 ]; then
            PASSED="false"
          fi

          STATUS="Passed"
          if [ "$PASSED" = "false" ]; then
            STATUS="Failed"
          fi

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "medium=$MEDIUM" >> $GITHUB_OUTPUT
          echo "low=$LOW" >> $GITHUB_OUTPUT
          echo "fixable=$FIXABLE" >> $GITHUB_OUTPUT
          echo "os_pkgs=$OS_PKGS" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT

          echo "📊 Scan Results:"
          echo "  Critical: $CRITICAL | High: $HIGH | Medium: $MEDIUM | Low: $LOW"
          echo "  Fixable: $FIXABLE | Passed: $PASSED"

      # ------------------------------------------------------------------ #
      # Upsert containerScan entity in Port
      # ------------------------------------------------------------------ #
      - name: Register scan results in Port
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: UPSERT
          identifier: ${{ inputs.service_identifier }}-scan-${{ inputs.image_tag }}
          title: "${{ inputs.service_identifier }} — ${{ inputs.image_tag }} Scan"
          blueprint: containerScan
          properties: |
            {
              "image_tag": "${{ inputs.image_tag }}",
              "scan_tool": "Trivy",
              "scanned_at": "${{ github.event.repository.updated_at }}",
              "critical_vulnerabilities": ${{ steps.parse.outputs.critical }},
              "high_vulnerabilities": ${{ steps.parse.outputs.high }},
              "medium_vulnerabilities": ${{ steps.parse.outputs.medium }},
              "low_vulnerabilities": ${{ steps.parse.outputs.low }},
              "fixable_vulnerabilities": ${{ steps.parse.outputs.fixable }},
              "os_packages_scanned": ${{ steps.parse.outputs.os_pkgs }},
              "passed": ${{ steps.parse.outputs.passed }},
              "status": "${{ steps.parse.outputs.status }}"
            }
          relations: |
            {
              "service": "${{ inputs.service_identifier }}"
            }

      - name: Report success to Port
        if: success()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_context }}
          status: SUCCESS
          logMessage: |
            🔒 Scan complete for ${{ inputs.service_identifier }}:${{ inputs.image_tag }}
            Critical: ${{ steps.parse.outputs.critical }} | High: ${{ steps.parse.outputs.high }} | Medium: ${{ steps.parse.outputs.medium }} | Low: ${{ steps.parse.outputs.low }}
            Fixable: ${{ steps.parse.outputs.fixable }} | Status: ${{ steps.parse.outputs.status }}
            📋 Scan entity registered in Port catalog

      - name: Report failure to Port
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_context }}
          status: FAILURE
          logMessage: "❌ Container scan failed for ${{ inputs.service_identifier }}:${{ inputs.image_tag }}. Check workflow logs."
