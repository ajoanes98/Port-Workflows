#Workflow for Meijer Demo
name: Provision Infrastructure

on:
  workflow_dispatch:
    inputs:
      service_identifier:
        description: "Port service identifier"
        required: true
        type: string
      environment:
        description: "Target environment (Development, Staging, Production)"
        required: true
        type: string
      terraform_action:
        description: "Terraform action (plan, apply, destroy)"
        required: true
        type: string
        default: "plan"
      cloud_region:
        description: "Target Azure region"
        required: false
        type: string
        default: "eastus"
      port_context:
        description: "Port run ID for status reporting"
        required: true
        type: string

jobs:
  terraform:
    name: "Terraform ${{ inputs.terraform_action }} — ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    env:
      PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
      PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_azure_location: ${{ inputs.cloud_region }}

    steps:
      - name: Report provisioning started
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_context }}
          logMessage: "🏗️  Starting Terraform ${{ inputs.terraform_action }} for ${{ inputs.service_identifier }} in ${{ inputs.environment }} (${{ inputs.cloud_region }})..."

      - name: Update cloud resource status to Provisioning
        if: inputs.terraform_action == 'apply'
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: UPSERT
          identifier: ${{ inputs.service_identifier }}-container-app-${{ inputs.environment }}
          blueprint: cloudResource
          properties: |
            { "status": "Provisioning" }

      # ------------------------------------------------------------------ #
      # Checkout the service repo that contains the Terraform config
      # ------------------------------------------------------------------ #
      - name: Checkout service repository
        uses: actions/checkout@v4
        with:
          repository: ajoanes98/${{ inputs.service_identifier }}
          token: ${{ secrets.GH_TOKEN }}
          path: service-repo

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      # ------------------------------------------------------------------ #
      # Terraform workflow
      # ------------------------------------------------------------------ #
      - name: Terraform Init
        working-directory: service-repo/infrastructure/terraform
        run: |
          terraform init \
            -backend-config="key=${{ inputs.service_identifier }}-${{ inputs.environment }}.terraform.tfstate"

      - name: Terraform Validate
        working-directory: service-repo/infrastructure/terraform
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: service-repo/infrastructure/terraform
        run: |
          terraform plan \
            -var="environment=$(echo '${{ inputs.environment }}' | tr '[:upper:]' '[:lower:]')" \
            -var="azure_location=${{ inputs.cloud_region }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan-output.txt

          echo "plan_summary=$(tail -5 plan-output.txt | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Report plan to Port
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_context }}
          logMessage: "📋 Terraform plan complete: ${{ steps.plan.outputs.plan_summary }}"

      - name: Terraform Apply
        if: inputs.terraform_action == 'apply'
        working-directory: service-repo/infrastructure/terraform
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: inputs.terraform_action == 'destroy'
        working-directory: service-repo/infrastructure/terraform
        run: |
          terraform destroy \
            -var="environment=$(echo '${{ inputs.environment }}' | tr '[:upper:]' '[:lower:]')" \
            -var="azure_location=${{ inputs.cloud_region }}" \
            -auto-approve

      # ------------------------------------------------------------------ #
      # Update Port catalog after apply/destroy
      # ------------------------------------------------------------------ #
      - name: Update cloud resource status after apply
        if: inputs.terraform_action == 'apply' && success()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: UPSERT
          identifier: ${{ inputs.service_identifier }}-container-app-${{ inputs.environment }}
          title: "${{ inputs.service_identifier }} — Container App (${{ inputs.environment }})"
          blueprint: cloudResource
          properties: |
            {
              "status": "Running",
              "cloud_provider": "Azure",
              "region": "${{ inputs.cloud_region }}",
              "resource_type": "Container App",
              "terraform_workspace": "${{ inputs.environment }}"
            }
          relations: |
            {
              "service": "${{ inputs.service_identifier }}",
              "environment": "{{ inputs.environment | downcase }}"
            }

      - name: Update cloud resource status after destroy
        if: inputs.terraform_action == 'destroy' && success()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: UPSERT
          identifier: ${{ inputs.service_identifier }}-container-app-${{ inputs.environment }}
          blueprint: cloudResource
          properties: |
            { "status": "Deprovisioned" }

      - name: Report success to Port
        if: success()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_context }}
          status: SUCCESS
          logMessage: |
            ✅ Terraform ${{ inputs.terraform_action }} complete for ${{ inputs.service_identifier }}
            🌍 Environment: ${{ inputs.environment }} | Region: ${{ inputs.cloud_region }}
            📊 Cloud resource status updated in Port catalog

      - name: Report failure to Port
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_context }}
          status: FAILURE
          logMessage: "❌ Terraform ${{ inputs.terraform_action }} failed for ${{ inputs.service_identifier }} in ${{ inputs.environment }}. Check workflow logs."
