name: Create Coder Template

on:
  workflow_dispatch:
    inputs:
      template_name:
        description: "Unique template identifier"
        required: true
        type: string
      display_name:
        description: "Human-readable display name"
        required: true
        type: string
      description:
        description: "Template description"
        required: false
        default: ""
        type: string
      team:
        description: "Target team name"
        required: true
        type: string
      tools:
        description: "JSON array of tools to install"
        required: false
        default: "[]"
        type: string
      node_version:
        description: "Node.js version"
        required: false
        default: "20"
        type: string
      python_version:
        description: "Python version"
        required: false
        default: "3.12"
        type: string
      namespace:
        description: "Kubernetes namespace"
        required: false
        default: "coder-workspaces"
        type: string
      cpu_request:
        description: "CPU request per workspace"
        required: false
        default: "1"
        type: string
      memory_request:
        description: "Memory request per workspace"
        required: false
        default: "1Gi"
        type: string
      disk_size_gb:
        description: "Persistent home disk size in GB"
        required: false
        default: "10"
        type: string
      ttl_days:
        description: "Max TTL in days (1-7)"
        required: false
        default: "1"
        type: string
      port_run_id:
        description: "Port action run ID"
        required: true
        type: string
      triggered_by:
        description: "Email of triggering user"
        required: false
        type: string

jobs:
  create-coder-template:
    name: Generate & Push Coder Template
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Notify Port - In Progress
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          logMessage: "Starting Coder template creation for '${{ inputs.template_name }}'..."

      - name: Parse tools
        id: tools
        if: always()
        shell: python3 {0}
        run: |
          import json, os
          raw = '${{ inputs.tools }}'.strip()
          try:
              parsed = json.loads(raw)
              if not isinstance(parsed, list):
                  parsed = []
          except Exception:
              parsed = []
          csv  = ','.join(parsed)
          jarr = json.dumps(parsed)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'csv={csv}\n')
              f.write(f'json={jarr}\n')
          print(f'Tools CSV : {csv}')
          print(f'Tools JSON: {jarr}')

      - name: Install Coder CLI
        run: |
          curl -fsSL https://coder.com/install.sh | sh
          coder version

      - name: Generate Coder Template with Docker backend
        id: generate
        shell: python3 {0}
        run: |
          import os

          tools_raw = "${{ steps.tools.outputs.csv }}"
          tools = [t.strip() for t in tools_raw.split(",") if t.strip()]
          node_ver = "${{ inputs.node_version }}" or "20"

          os.makedirs("template", exist_ok=True)

          # Build startup lines
          lines = [
              "#!/bin/bash",
              "export DEBIAN_FRONTEND=noninteractive",
              "apt-get update -qq",
              "apt-get install -y --no-install-recommends curl wget ca-certificates gnupg lsb-release unzip zip build-essential software-properties-common apt-transport-https && rm -rf /var/lib/apt/lists/*",
          ]
          if "git-github-cli" in tools:
              lines += [
                  "apt-get update && apt-get install -y git",
                  "curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg",
                  'echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list',
                  "apt-get update && apt-get install -y gh && rm -rf /var/lib/apt/lists/* || true",
              ]
          if "nodejs" in tools:
              lines.append(f"curl -fsSL https://deb.nodesource.com/setup_{node_ver}.x | bash - && apt-get install -y nodejs && rm -rf /var/lib/apt/lists/* || true")
          if "python3" in tools:
              lines.append("apt-get update && apt-get install -y python3 python3-venv python3-dev python3-pip && rm -rf /var/lib/apt/lists/* || true")
          if "java17" in tools:
              lines += [
                  "apt-get update && apt-get install -y wget apt-transport-https && mkdir -p /etc/apt/keyrings",
                  "wget -O - https://packages.adoptium.net/artifactory/api/gpg/key/public | tee /etc/apt/keyrings/adoptium.asc",
                  'echo "deb [signed-by=/etc/apt/keyrings/adoptium.asc] https://packages.adoptium.net/artifactory/deb $(lsb_release -cs) main" | tee /etc/apt/sources.list.d/adoptium.list',
                  "apt-get update && apt-get install -y temurin-17-jdk && rm -rf /var/lib/apt/lists/* || true",
              ]
          if "terraform" in tools:
              lines += [
                  "wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg",
                  'echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | tee /etc/apt/sources.list.d/hashicorp.list',
                  "apt-get update && apt-get install -y terraform && rm -rf /var/lib/apt/lists/* || true",
              ]
          if "gcloud-cli" in tools:
              lines += [
                  'echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | tee /etc/apt/sources.list.d/google-cloud-sdk.list',
                  "curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg",
                  "apt-get update && apt-get install -y google-cloud-cli && rm -rf /var/lib/apt/lists/* || true",
              ]
          if "vscode-server" in tools:
              lines += [
                  "if ! command -v code-server &>/dev/null; then curl -fsSL https://code-server.dev/install.sh | sh || true; fi",
                  "if command -v code-server &>/dev/null; then code-server --bind-addr 0.0.0.0:13337 --auth none & fi",
              ]
          lines.append('echo "Startup complete"')

          # Write startup.sh
          with open("template/startup.sh", "w") as f:
              f.write("\n".join(lines) + "\n")

          # Indent startup lines for HCL heredoc
          indented = "\n".join("              " + ln for ln in lines)

          main_tf = (
              "terraform {\n"
              "  required_providers {\n"
              "    coder = { source = \"coder/coder\", version = \"~> 0.11\" }\n"
              "    docker = { source = \"kreuzwerker/docker\", version = \"~> 3.0\" }\n"
              "  }\n"
              "}\n\n"
              "provider \"coder\" {}\n"
              "provider \"docker\" { host = \"unix:///var/run/docker.sock\" }\n\n"
              "data \"coder_workspace\" \"me\" {}\n"
              "data \"coder_workspace_owner\" \"me\" {}\n\n"
              "resource \"coder_agent\" \"main\" {\n"
              "  arch = \"arm64\"\n"
              "  os   = \"linux\"\n"
              "  startup_script = <<-EOT\n"
              + indented + "\n"
              "  EOT\n"
              "}\n\n"
              "resource \"docker_volume\" \"home\" {\n"
              "  name = \"coder-${data.coder_workspace_owner.me.name}-${data.coder_workspace.me.name}-home\"\n"
              "}\n\n"
              "resource \"docker_container\" \"workspace\" {\n"
              "  count   = data.coder_workspace.me.start_count\n"
              "  image   = \"codercom/enterprise-base:ubuntu\"\n"
              "  name    = \"coder-${data.coder_workspace_owner.me.name}-${data.coder_workspace.me.name}\"\n"
              "  command = [\"sh\", \"-c\", coder_agent.main.init_script]\n"
              "  env     = [\"CODER_AGENT_TOKEN=${coder_agent.main.token}\"]\n"
              "  host { host = \"host.docker.internal\"; ip = \"host-gateway\" }\n"
              "  volumes { container_path = \"/home/coder\"; volume_name = docker_volume.home.name; read_only = false }\n"
              "}\n\n"
              "resource \"coder_app\" \"code-server\" {\n"
              "  agent_id     = coder_agent.main.id\n"
              "  slug         = \"code-server\"\n"
              "  display_name = \"VS Code\"\n"
              "  url          = \"http://localhost:13337/?folder=/home/coder\"\n"
              "  icon         = \"/icon/code.svg\"\n"
              "  subdomain    = false\n"
              "  share        = \"owner\"\n"
              "}\n"
          )

          with open("template/main.tf", "w") as f:
              f.write(main_tf)

          print("Generated main.tf successfully")
          print(open("template/main.tf").read())


      - name: Authenticate Coder CLI
        run: |
          echo "Connecting to Coder at: ${{ secrets.CODER_URL }}"
          curl -sf "${{ secrets.CODER_URL }}/api/v2/users/first" || echo "WARNING: Cannot reach Coder URL"
          CODER_TOKEN="${{ secrets.CODER_TOKEN }}"
          coder login "${{ secrets.CODER_URL }}" --token "$CODER_TOKEN"

      - name: Push Template to Coder
        id: push_template
        run: |
          set -euo pipefail
          TTL_SECS=$(( ${{ inputs.ttl_days }} * 86400 ))

          if coder templates show "${{ inputs.template_name }}" 2>/dev/null; then
            echo "Template exists — pushing new version..."
            coder templates push "${{ inputs.template_name }}" \
              --directory=template \
              --name="${{ inputs.template_name }}-v${GITHUB_RUN_NUMBER}" \
              --yes
          else
            echo "Creating new template '${{ inputs.template_name }}'..."
            coder templates create "${{ inputs.template_name }}" \
              --directory=template \
              --default-ttl="${TTL_SECS}s" \
              --yes
          fi

          echo "template_url=http://localhost:8080/templates/${{ inputs.template_name }}" >> $GITHUB_OUTPUT
          echo "Template pushed successfully."

      - name: Create Port Template Entity
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: UPSERT
          identifier: ${{ inputs.template_name }}
          title: ${{ inputs.display_name }}
          blueprint: coder_template
          runId: ${{ inputs.port_run_id }}
          properties: |-
            {
              "template_name": "${{ inputs.template_name }}",
              "display_name": "${{ inputs.display_name }}",
              "description": "${{ inputs.description }}",
              "tools": ${{ steps.tools.outputs.json }},
              "cpu_request": "${{ inputs.cpu_request }}",
              "memory_request": "${{ inputs.memory_request }}",
              "disk_size_gb": ${{ inputs.disk_size_gb }},
              "namespace": "${{ inputs.namespace }}",
              "ttl_days": ${{ inputs.ttl_days }},
              "team": "${{ inputs.team }}",
              "coder_url": "${{ secrets.CODER_URL }}/templates/${{ inputs.template_name }}",
              "status": "READY",
              "created_by": "${{ inputs.triggered_by }}"
            }

      - name: Notify Port - Success
        if: success()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          status: "SUCCESS"
          logMessage: "✅ Coder template '${{ inputs.display_name }}' created. URL: ${{ secrets.CODER_URL }}/templates/${{ inputs.template_name }}"

      - name: Mark Entity Failed
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: UPSERT
          identifier: ${{ inputs.template_name }}
          blueprint: coder_template
          runId: ${{ inputs.port_run_id }}
          properties: |-
            {
              "template_name": "${{ inputs.template_name }}",
              "tools": ${{ steps.tools.outputs.json }},
              "status": "FAILED"
            }

      - name: Notify Port - Failure
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          status: "FAILURE"
          logMessage: "❌ Failed to create Coder template '${{ inputs.template_name }}'. Check Actions logs."
