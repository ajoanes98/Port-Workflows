name: Create Coder Template

on:
  workflow_dispatch:
    inputs:
      template_name:
        description: "Unique template identifier"
        required: true
        type: string
      display_name:
        description: "Human-readable display name"
        required: true
        type: string
      description:
        description: "Template description"
        required: false
        default: ""
        type: string
      team:
        description: "Target team name"
        required: true
        type: string
      tools:
        description: "JSON array of tools to install"
        required: false
        default: "[]"
        type: string
      node_version:
        description: "Node.js version"
        required: false
        default: "20"
        type: string
      python_version:
        description: "Python version"
        required: false
        default: "3.12"
        type: string
      namespace:
        description: "Kubernetes namespace"
        required: false
        default: "coder-workspaces"
        type: string
      cpu_request:
        description: "CPU request per workspace"
        required: false
        default: "1"
        type: string
      memory_request:
        description: "Memory request per workspace"
        required: false
        default: "1Gi"
        type: string
      disk_size_gb:
        description: "Persistent home disk size in GB"
        required: false
        default: "10"
        type: string
      ttl_days:
        description: "Max TTL in days (1-7)"
        required: false
        default: "1"
        type: string
      port_run_id:
        description: "Port action run ID"
        required: true
        type: string
      triggered_by:
        description: "Email of triggering user"
        required: false
        type: string

jobs:
  create-coder-template:
    name: Generate & Push Coder Template
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Notify Port - In Progress
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          logMessage: "Starting Coder template creation for '${{ inputs.template_name }}'..."

      - name: Parse tools
        id: tools
        if: always()
        shell: python3 {0}
        run: |
          import json, os
          raw = '${{ inputs.tools }}'.strip()
          try:
              parsed = json.loads(raw)
              if not isinstance(parsed, list):
                  parsed = []
          except Exception:
              parsed = []
          csv  = ','.join(parsed)
          jarr = json.dumps(parsed)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'csv={csv}\n')
              f.write(f'json={jarr}\n')
          print(f'Tools CSV : {csv}')
          print(f'Tools JSON: {jarr}')

      - name: Install Coder CLI
        run: |
          curl -fsSL https://coder.com/install.sh | sh
          coder version

      - name: Generate Coder Template with Docker backend
        id: generate
        run: |
          set -euo pipefail
          TOOLS="${{ steps.tools.outputs.csv }}"
          NODE_VER="${{ inputs.node_version }}"
          PY_VER="${{ inputs.python_version }}"
          mkdir -p template

          # main.tf — Docker provider using local Docker Desktop socket
          cat > template/main.tf << 'TERRAFORM'
          terraform {
            required_providers {
              coder = {
                source  = "coder/coder"
                version = "~> 0.11"
              }
              docker = {
                source  = "kreuzwerker/docker"
                version = "~> 3.0"
              }
            }
          }

          provider "coder" {}

          provider "docker" {
            host = "unix:///var/run/docker.sock"
          }

          data "coder_workspace" "me" {}
          data "coder_workspace_owner" "me" {}

          resource "coder_agent" "main" {
            arch           = "arm64"
            os             = "linux"
            startup_script = <<-EOT
              #!/bin/bash
              # Install code-server if not present — tolerates failures
              if ! command -v code-server &>/dev/null; then
                curl -fsSL https://code-server.dev/install.sh | sh || true
              fi
              # Start code-server if available
              if command -v code-server &>/dev/null; then
                code-server --bind-addr 0.0.0.0:13337 --auth none &
              fi
              echo "Startup complete"
            EOT
          }

          resource "docker_volume" "home" {
            name = "coder-${data.coder_workspace_owner.me.name}-${data.coder_workspace.me.name}-home"
          }

          resource "docker_container" "workspace" {
            count   = data.coder_workspace.me.start_count
            image   = "codercom/enterprise-base:ubuntu"
            name    = "coder-${data.coder_workspace_owner.me.name}-${data.coder_workspace.me.name}"
            command = ["sh", "-c", coder_agent.main.init_script]

            env = [
              "CODER_AGENT_TOKEN=${coder_agent.main.token}"
            ]

            host {
              host = "host.docker.internal"
              ip   = "host-gateway"
            }

            volumes {
              container_path = "/home/coder"
              volume_name    = docker_volume.home.name
              read_only      = false
            }
          }

          resource "coder_app" "code-server" {
            agent_id     = coder_agent.main.id
            slug         = "code-server"
            display_name = "VS Code"
            url          = "http://localhost:13337/?folder=/home/coder"
            icon         = "/icon/code.svg"
            subdomain    = false
            share        = "owner"
          }
          TERRAFORM

          echo "=== Generated main.tf ==="
          cat template/main.tf

      - name: Authenticate Coder CLI
        run: |
          echo "Connecting to Coder at: ${{ secrets.CODER_URL }}"
          curl -sf "${{ secrets.CODER_URL }}/api/v2/users/first" || echo "WARNING: Cannot reach Coder URL"
          CODER_TOKEN="${{ secrets.CODER_TOKEN }}"
          coder login "${{ secrets.CODER_URL }}" --token "$CODER_TOKEN"

      - name: Push Template to Coder
        id: push_template
        run: |
          set -euo pipefail
          TTL_SECS=$(( ${{ inputs.ttl_days }} * 86400 ))

          if coder templates show "${{ inputs.template_name }}" 2>/dev/null; then
            echo "Template exists — pushing new version..."
            coder templates push "${{ inputs.template_name }}" \
              --directory=template \
              --name="${{ inputs.template_name }}-v${GITHUB_RUN_NUMBER}" \
              --yes
          else
            echo "Creating new template '${{ inputs.template_name }}'..."
            coder templates create "${{ inputs.template_name }}" \
              --directory=template \
              --default-ttl="${TTL_SECS}s" \
              --yes
          fi

          echo "template_url=http://localhost:8080/templates/${{ inputs.template_name }}" >> $GITHUB_OUTPUT
          echo "Template pushed successfully."

      - name: Create Port Template Entity
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: UPSERT
          identifier: ${{ inputs.template_name }}
          title: ${{ inputs.display_name }}
          blueprint: coder_template
          runId: ${{ inputs.port_run_id }}
          properties: |-
            {
              "template_name": "${{ inputs.template_name }}",
              "display_name": "${{ inputs.display_name }}",
              "description": "${{ inputs.description }}",
              "tools": ${{ steps.tools.outputs.json }},
              "cpu_request": "${{ inputs.cpu_request }}",
              "memory_request": "${{ inputs.memory_request }}",
              "disk_size_gb": ${{ inputs.disk_size_gb }},
              "namespace": "${{ inputs.namespace }}",
              "ttl_days": ${{ inputs.ttl_days }},
              "team": "${{ inputs.team }}",
              "coder_url": "${{ secrets.CODER_URL }}/templates/${{ inputs.template_name }}",
              "status": "READY",
              "created_by": "${{ inputs.triggered_by }}"
            }

      - name: Notify Port - Success
        if: success()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          status: "SUCCESS"
          logMessage: "✅ Coder template '${{ inputs.display_name }}' created. URL: ${{ secrets.CODER_URL }}/templates/${{ inputs.template_name }}"

      - name: Mark Entity Failed
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: UPSERT
          identifier: ${{ inputs.template_name }}
          blueprint: coder_template
          runId: ${{ inputs.port_run_id }}
          properties: |-
            {
              "template_name": "${{ inputs.template_name }}",
              "tools": ${{ steps.tools.outputs.json }},
              "status": "FAILED"
            }

      - name: Notify Port - Failure
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          status: "FAILURE"
          logMessage: "❌ Failed to create Coder template '${{ inputs.template_name }}'. Check Actions logs."
