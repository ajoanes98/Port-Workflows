#workflow for Meijer Demo
name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      workload_identifier:
        description: "Port workload identifier (e.g. meijer-inventory-api-Staging-workload)"
        required: true
        type: string
      service_identifier:
        description: "Port service identifier — resolved from the workload's service relation"
        required: true
        type: string
      image_tag:
        description: "Staging image tag to promote"
        required: true
        type: string
      release_notes:
        description: "Summary of changes in this release"
        required: false
        type: string
      approved_by:
        description: "Email of the approver (from Port)"
        required: false
        type: string
      port_context:
        description: "Port run ID for status reporting"
        required: true
        type: string

jobs:
  pre-promotion-checks:
    name: Pre-Promotion Validation
    runs-on: ubuntu-latest
    env:
      PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
      PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}

    outputs:
      workload_env: ${{ steps.checks.outputs.workload_env }}

    steps:
      - name: Report checks started
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.us.port.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_context }}
          logMessage: |
            🔍 Running pre-promotion checks for workload '${{ inputs.workload_identifier }}'
            Service: ${{ inputs.service_identifier }} | Image: ${{ inputs.image_tag }}
            👤 Approved by: ${{ inputs.approved_by }}
            📊 Enforcing workload scorecard gates:
               • Security & Compliance (Service) ≥ Silver
               • Quality Maturity (Service) ≥ Bronze
               • Production Readiness (Service) ≥ Bronze

      - name: Run promotion validation checks
        id: checks
        run: |
          set -euo pipefail

          # Get Port access token
          TOKEN=$(curl -s -X POST https://api.us.port.io/v1/auth/access_token \
            -H "Content-Type: application/json" \
            -d '{"clientId":"${{ secrets.PORT_CLIENT_ID }}","clientSecret":"${{ secrets.PORT_CLIENT_SECRET }}"}' \
            | jq -r '.accessToken')

          # Fetch workload via search so scorecard results are included in the response
          SEARCH_BODY=$(jq -n \
            --arg id "${{ inputs.workload_identifier }}" \
            '{
              query: {
                combinator: "and",
                rules: [
                  { operator: "=", property: "$identifier", value: $id }
                ]
              }
            }')

          WORKLOAD_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$SEARCH_BODY" \
            "https://api.us.port.io/v1/blueprints/workload/entities/search")

          ENTITY_COUNT=$(echo "$WORKLOAD_RESPONSE" | jq '.entities | length')
          if [ "$ENTITY_COUNT" -eq 0 ]; then
            echo "❌ Workload '${{ inputs.workload_identifier }}' was not found in Port"
            exit 1
          fi

          # Verify the workload being promoted is in Staging (not Dev)
          WORKLOAD_ENV=$(echo "$WORKLOAD_RESPONSE" | jq -r '.entities[0].relations.environment // "unknown"')
          echo "$WORKLOAD_RESPONSE" | jq '.entities[0].scorecards // {}' > /tmp/workload-scorecards.json

          echo "workload_env=$WORKLOAD_ENV" >> $GITHUB_OUTPUT

          echo "Workload environment: $WORKLOAD_ENV"
          echo "Scorecard snapshot:"
          cat /tmp/workload-scorecards.json | jq '.'

      - name: Enforce promotion gates
        run: |
          set -euo pipefail

          SCORECARDS_FILE="/tmp/workload-scorecards.json"
          WORKLOAD_ENV='${{ steps.checks.outputs.workload_env }}'
          GATE_FAILED=false

          scorecard_level() {
            jq -r --arg id "$1" '.[$id].level // "Basic"' "$SCORECARDS_FILE"
          }

          scorecard_rank() {
            case "$1" in
              Basic) echo 0 ;;
              Maturing) echo 1 ;;
              Bronze) echo 2 ;;
              Silver) echo 3 ;;
              Gold) echo 4 ;;
              *) echo 0 ;;
            esac
          }

          meets_minimum() {
            local current="$1"
            local minimum="$2"
            [ "$(scorecard_rank "$current")" -ge "$(scorecard_rank "$minimum")" ]
          }

          print_failed_rules() {
            local scorecard_id="$1"
            jq -r --arg id "$scorecard_id" '
              .[$id].rules[]? | select(.status == "FAILURE" or .status == "Not passed") | "      - \(.title // .identifier)"' \
              "$SCORECARDS_FILE"
          }

          check_scorecard_gate() {
            local scorecard_id="$1"
            local scorecard_title="$2"
            local minimum_level="$3"
            local current_level
            current_level=$(scorecard_level "$scorecard_id")

            echo ""
            echo "📋 $scorecard_title"
            echo "   Required: ≥ $minimum_level | Current: $current_level"

            if meets_minimum "$current_level" "$minimum_level"; then
              echo "   ✅ Passed"
            else
              echo "   ❌ GATE FAILED: scorecard level is below $minimum_level"
              FAILED_RULES=$(print_failed_rules "$scorecard_id")
              if [ -n "$FAILED_RULES" ]; then
                echo "   Failed rules:"
                echo "$FAILED_RULES"
              fi
              GATE_FAILED=true
            fi
          }

          # Gate 1: Must be deployed to Staging first
          echo "=== Gate 1: Staging workload ==="
          if [[ "$WORKLOAD_ENV" == "staging" ]]; then
            echo "✅ Staging gate: Workload is linked to the staging environment"
          else
            echo "❌ GATE FAILED: Service must be deployed to Staging before promoting to Production (current: $WORKLOAD_ENV)."
            GATE_FAILED=true
          fi

          # Gate 2: Workload scorecards (mirrored from backing service)
          echo ""
          echo "=== Gate 2: Workload scorecards ==="
          check_scorecard_gate "workload_security_maturity" "Security & Compliance (Service)" "Silver"
          check_scorecard_gate "workload_quality_maturity" "Quality Maturity (Service)" "Bronze"
          check_scorecard_gate "workload_production_readiness" "Production Readiness (Service)" "Bronze"

          if [ "$GATE_FAILED" = true ]; then
            echo ""
            echo "❌ Promotion blocked — resolve failing scorecard rules on the workload in Port, then retry."
            exit 1
          fi

          echo ""
          echo "✅ All promotion gates passed — proceeding to production deployment."

      - name: Report gates passed
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.us.port.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_context }}
          logMessage: "✅ Pre-promotion scorecard gates passed. Proceeding to production deployment."

  promote:
    name: Promote to Production
    runs-on: ubuntu-latest
    needs: [pre-promotion-checks]
    environment:
      name: Production
      url: https://meijer-internal.com
    env:
      PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
      PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}

    steps:
      - name: Report promotion started
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.us.port.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_context }}
          logMessage: "🚀 Promoting workload '${{ inputs.workload_identifier }}' (${{ inputs.service_identifier }}:${{ inputs.image_tag }}) to Production..."

      # ------------------------------------------------------------------ #
      # Replace this step with your actual production deployment mechanism
      # ------------------------------------------------------------------ #
      - name: Deploy to Production
        run: |
          echo "🐳 Image: ${{ inputs.service_identifier }}:${{ inputs.image_tag }}"
          echo "☁️  Target: Production (Azure primary + GCP DR)"
          echo ""
          echo "--- Simulated production promotion steps ---"
          echo "1. Authenticating with Azure Container Registry..."
          echo "2. Tagging image as production-stable..."
          echo "3. Applying Kubernetes manifests to namespace meijer-prod..."
          echo "4. Performing blue/green switch..."
          echo "5. Running smoke tests..."
          echo "6. Verifying health endpoints..."
          echo "7. Replicating to GCP (DR)..."
          echo ""
          echo "✅ Production promotion complete."
          # Replace with real commands, e.g.:
          # az acr import --name meijeracr --source meijeracr.azurecr.io/${{ inputs.service_identifier }}:${{ inputs.image_tag }} \
          #   --image ${{ inputs.service_identifier }}:production-stable
          # kubectl set image deployment/${{ inputs.service_identifier }} \
          #   app=meijeracr.azurecr.io/${{ inputs.service_identifier }}:production-stable \
          #   -n meijer-prod

      # ------------------------------------------------------------------ #
      # Register production deployment entity and update service in Port
      # ------------------------------------------------------------------ #
      - name: Create production workload entity in Port
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.us.port.io
          operation: UPSERT
          identifier: ${{ inputs.service_identifier }}-production-workload
          title: "${{ inputs.service_identifier }} (Production)"
          blueprint: workload
          properties: |
            {
              "version": "${{ inputs.image_tag }}"
            }
          relations: |
            {
              "service": "${{ inputs.service_identifier }}",
              "environment": "production"
            }

      - name: Update service lifecycle to Production in Port
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.us.port.io
          operation: UPSERT
          identifier: ${{ inputs.service_identifier }}
          blueprint: service
          properties: |
            {
              "lifecycle_stage": "Production",
              "onboarding_status": "Complete"
            }

      - name: Report success to Port
        if: success()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.us.port.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_context }}
          status: SUCCESS
          logMessage: |
            🎉 Workload '${{ inputs.workload_identifier }}' is LIVE in Production!
            Service: ${{ inputs.service_identifier }} | Image: ${{ inputs.image_tag }}
            👤 Approved by: ${{ inputs.approved_by }}
            📝 Release notes: ${{ inputs.release_notes }}
            🏷️  Production workload entity created in Port catalog
            📊 Service lifecycle stage updated to: Production
            🟢 Onboarding status updated to: Complete

      - name: Report failure to Port
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.us.port.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_context }}
          status: FAILURE
          logMessage: "❌ Production promotion of workload '${{ inputs.workload_identifier }}' (${{ inputs.service_identifier }}:${{ inputs.image_tag }}) failed. Check workflow logs."
