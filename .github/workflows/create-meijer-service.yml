name: Create Meijer Service

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: 'Name of the new service'
        required: true
        type: string
      frontend:
        description: 'Frontend technology'
        required: true
        type: string
      backend:
        description: 'Backend technology'
        required: true
        type: string
      database_type:
        description: 'Database type'
        required: true
        type: string
      containerization:
        description: 'Containerization platform'
        required: true
        type: string
      terraform_template:
        description: 'Terraform template entity identifier'
        required: true
        type: string
      port_context:
        description: 'Port trigger context (JSON)'
        required: true
        type: string

jobs:
  create-service:
    runs-on: ubuntu-latest
    steps:

      # ── 1. Report "In Progress" to Port ──────────────────────────────────
      - name: Notify Port — In Progress
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.port.io
          operation: PATCH_RUN
          runId: ${{ fromJson(inputs.port_context).runId }}
          logMessage: "🚀 Starting service creation for '${{ inputs.service_name }}'..."
      #    status: IN_PROGRESS

      # ── 2. Checkout the repo ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 3. Set up tooling based on backend choice ─────────────────────────
      - name: Set up Python
        if: ${{ inputs.backend == 'Python' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET
        if: ${{ inputs.backend == '.NET Web API' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Java
        if: ${{ inputs.backend == 'Java' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── 4. Scaffold the service directory structure ───────────────────────
      - name: Scaffold service
        run: |
          SERVICE_DIR="services/${{ inputs.service_name }}"
          mkdir -p "$SERVICE_DIR"/{src,tests,infra}

          cat > "$SERVICE_DIR/README.md" <<EOF
          # ${{ inputs.service_name }}

          | Property | Value |
          |---|---|
          | **Frontend** | ${{ inputs.frontend }} |
          | **Backend** | ${{ inputs.backend }} |
          | **Database** | ${{ inputs.database_type }} |
          | **Containerization** | ${{ inputs.containerization }} |
          | **Terraform Template** | ${{ inputs.terraform_template }} |

          > Generated by Port self-service action.
          EOF

          echo "✅ Scaffolded $SERVICE_DIR"

      # ── 5. Generate Dockerfile / Kubernetes manifest ──────────────────────
      - name: Generate container config
        run: |
          SERVICE_DIR="services/${{ inputs.service_name }}"

          # ── Resolve base Docker image by backend ──
          case "${{ inputs.backend }}" in
            "Python")       BASE_IMAGE="python:3.12-slim";    CMD='["python", "main.py"]' ;;
            ".NET Web API") BASE_IMAGE="mcr.microsoft.com/dotnet/aspnet:8.0"; CMD='["dotnet", "app.dll"]' ;;
            "Java")         BASE_IMAGE="eclipse-temurin:21-jre-alpine"; CMD='["java", "-jar", "app.jar"]' ;;
            *)              BASE_IMAGE="ubuntu:24.04";        CMD='["/bin/sh"]' ;;
          esac

          if [ "${{ inputs.containerization }}" == "Docker" ] || [ "${{ inputs.containerization }}" == "Podman" ]; then
            cat > "$SERVICE_DIR/Dockerfile" <<EOF
          FROM $BASE_IMAGE
          WORKDIR /app
          COPY src/ .
          EXPOSE 8080
          CMD $CMD
          EOF
            echo "✅ Dockerfile generated (base: $BASE_IMAGE)"
          fi

          if [ "${{ inputs.containerization }}" == "Kubernetes" ]; then
            cat > "$SERVICE_DIR/infra/deployment.yaml" <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${{ inputs.service_name }}
            labels:
              app: ${{ inputs.service_name }}
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: ${{ inputs.service_name }}
            template:
              metadata:
                labels:
                  app: ${{ inputs.service_name }}
              spec:
                containers:
                  - name: ${{ inputs.service_name }}
                    image: ${{ inputs.service_name }}:latest
                    ports:
                      - containerPort: 8080
                    resources:
                      requests:
                        cpu: "100m"
                        memory: "128Mi"
                      limits:
                        cpu: "500m"
                        memory: "512Mi"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${{ inputs.service_name }}
          spec:
            selector:
              app: ${{ inputs.service_name }}
            ports:
              - port: 80
                targetPort: 8080
            type: ClusterIP
          EOF
            echo "✅ Kubernetes manifests generated"
          fi

      # ── 6. Copy Terraform template from catalog ───────────────────────────
      - name: Checkout terraform-catalog
        uses: actions/checkout@v4
        with:
          repository: ajoanes98/terraform-catalog
          path: terraform-catalog
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy Terraform template into service infra
        run: |
          SERVICE_INFRA="services/${{ inputs.service_name }}/infra/terraform"
          TEMPLATE_ID="${{ inputs.terraform_template }}"

          # Map Port entity identifier → directory in terraform-catalog
          case "$TEMPLATE_ID" in
            aws-vpc-standard)    TEMPLATE_DIR="terraform-catalog/aws-vpc" ;;
            aws-eks-cluster)     TEMPLATE_DIR="terraform-catalog/aws-eks" ;;
            azure-vnet-standard) TEMPLATE_DIR="terraform-catalog/azure-vnet" ;;
            azure-aks-cluster)   TEMPLATE_DIR="terraform-catalog/azure-aks" ;;
            *)
              echo "⚠️  Unknown template '$TEMPLATE_ID' — creating empty infra dir"
              mkdir -p "$SERVICE_INFRA"
              echo "# Unknown template: $TEMPLATE_ID" > "$SERVICE_INFRA/main.tf"
              exit 0
              ;;
          esac

          mkdir -p "$SERVICE_INFRA"
          cp "$TEMPLATE_DIR"/*.tf "$SERVICE_INFRA/"

          # Inject a service-specific tfvars file
          cat > "$SERVICE_INFRA/service.auto.tfvars" <<EOF
          # Auto-generated by Port — do not edit manually
          # Service: ${{ inputs.service_name }}
          # Template: $TEMPLATE_ID
          environment            = "dev"
          team                   = "platform"
          port_entity_identifier = "${{ inputs.service_name }}"
          EOF

          echo "✅ Terraform template '$TEMPLATE_ID' copied to $SERVICE_INFRA"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Validate
        working-directory: services/${{ inputs.service_name }}/infra/terraform
        run: |
          terraform init -backend=false
          terraform validate
        continue-on-error: true

      # ── 7. Commit & push the scaffolded service ───────────────────────────
      - name: Commit and push
        run: |
          git config user.name  "port-bot"
          git config user.email "port-bot@getport.io"
          git checkout -b "service/${{ inputs.service_name }}"
          git add services/${{ inputs.service_name }}
          git commit -m "feat: scaffold service ${{ inputs.service_name }} via Port

          - Frontend:  ${{ inputs.frontend }}
          - Backend:   ${{ inputs.backend }}
          - Database:  ${{ inputs.database_type }}
          - Container: ${{ inputs.containerization }}
          - Terraform: ${{ inputs.terraform_template }}"
          git push origin "service/${{ inputs.service_name }}"
          echo "✅ Branch pushed: service/${{ inputs.service_name }}"

      # ── 8. Register the new Service entity in Port ────────────────────────
      - name: Register Service entity in Port
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.port.io
          operation: UPSERT
          identifier: ${{ inputs.service_name }}
          title: ${{ inputs.service_name }}
          blueprint: service
          properties: |
            {
              "frontend": "${{ inputs.frontend }}",
              "backend": "${{ inputs.backend }}",
              "database_type": "${{ inputs.database_type }}",
              "containerization": "${{ inputs.containerization }}"
            }
          relations: |
            {
              "terraform_template": "${{ inputs.terraform_template }}"
            }

      # ── 9. Report success to Port ─────────────────────────────────────────
      - name: Notify Port — Success
        if: success()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.port.io
          operation: PATCH_RUN
          runId: ${{ fromJson(inputs.port_context).runId }}
          logMessage: "✅ Service '${{ inputs.service_name }}' created successfully! Branch: service/${{ inputs.service_name }}"
          status: SUCCESS

      # ── 10. Report failure to Port ────────────────────────────────────────
      - name: Notify Port — Failure
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.port.io
          operation: PATCH_RUN
          runId: ${{ fromJson(inputs.port_context).runId }}
          logMessage: "❌ Failed to create service '${{ inputs.service_name }}'. Check the workflow logs."
          status: FAILURE
