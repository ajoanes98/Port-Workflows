name: Create Meijer Service

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: 'Name of the new service'
        required: true
        type: string
      frontend:
        description: 'Frontend technology'
        required: true
        type: string
      backend:
        description: 'Backend technology'
        required: true
        type: string
      database_type:
        description: 'Database type'
        required: true
        type: string
      containerization:
        description: 'Containerization platform'
        required: true
        type: string
      terraform_template:
        description: 'Terraform template entity identifier'
        required: true
        type: string
      port_context:
        description: 'Port trigger context (JSON)'
        required: true
        type: string

jobs:
  create-service:
    runs-on: ubuntu-latest
    steps:

      # ── 1. Report "In Progress" to Port ──────────────────────────────────
      - name: Notify Port — In Progress
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ fromJson(inputs.port_context).runId }}
          logMessage: "🚀 Starting service creation for '${{ inputs.service_name }}'..."
          status: IN_PROGRESS

      # ── 2. Checkout the repo ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 3. Set up tooling based on backend choice ─────────────────────────
      - name: Set up Python
        if: ${{ inputs.backend == 'Python' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET
        if: ${{ inputs.backend == '.NET Web API' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Java
        if: ${{ inputs.backend == 'Java' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── 4. Scaffold the service directory structure ───────────────────────
      - name: Scaffold service
        run: |
          SERVICE_DIR="services/${{ inputs.service_name }}"
          mkdir -p "$SERVICE_DIR"/{src,tests,infra}

          echo "# ${{ inputs.service_name }}" > "$SERVICE_DIR/README.md"
          echo "- **Frontend:** ${{ inputs.frontend }}" >> "$SERVICE_DIR/README.md"
          echo "- **Backend:** ${{ inputs.backend }}" >> "$SERVICE_DIR/README.md"
          echo "- **Database:** ${{ inputs.database_type }}" >> "$SERVICE_DIR/README.md"
          echo "- **Containerization:** ${{ inputs.containerization }}" >> "$SERVICE_DIR/README.md"
          echo "- **Terraform Template:** ${{ inputs.terraform_template }}" >> "$SERVICE_DIR/README.md"

          echo "✅ Service directory scaff $SERVICE_DIR"

      # ── 5. Generate Dockerfile / Kubernetes manifest ──────────────────────
      - name: Generate container config
        run: |
          SERVICE_DIR="services/${{ inputs.service_name }}"

          if [ "${{ inputs.containerization }}" == "Docker" ] || [ "${{ inputs.containerization }}" == "Podman" ]; then
            cat > "$SERVICE_DIR/Dockerfile" <<EOF
          FROM python:3.12-slim
          WORKDIR /app
          COPY src/ .
          EXPOSE 8080
          CMD ["python", "main.py"]
          EOF
            echo "✅ Dockerfile generated"
          fi

          if [ "${{ inputs.containerization }}" == "Kubernetes" ]; then
            cat > "$SERVICE_DIR/infra/deployment.yaml" <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${{ inputs.service_name }}
          spec:
            replicas: 2
            selector:
              matchLab2
            selector:
              matchLabels:
                app: ${{ inputs.service_name }}
            template:
              metadata:
                labels:
                  app: ${{ inputs.service_name }}
              spec:
                containers:
                  - name: ${{ inputs.service_name }}
                    image: ${{ inputs.service_name }}:latest
                    ports:
                      - containerPort: 8080
          EOF
            echo "✅ Kubernetes manifest generated"
          fi

      # ── 6. Set up Terraform from the selected template ────────────────────
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Generate Terraform config
        run: |
          SERVICE_DIR="services/${{ inputs.service_name }}/infra"

          cat > "$SERVICE_DIR/main.tf" <<EOF
          # Auto-generated by Port — Create Service action
          # Template: ${{ inputs.terraform_template }}

          terraform {
            required_version = ">= 1.5.0"
          }

          variable "service_name" {
            default = "${{ inputs.service_name }}"
          }

          variable "database_type" {
            default = "${{ inputs.database_type }}"
          }

          # TODO: Replace with resources from template '${{ inputs.terraform_template }}'
          EOF

          echo "✅ Terraform config generated"

      - name: Terraform Init & Validate
        working-directory: services/${{ inputs.service_name }}/infra
        run: |
          terraform init -backend=false
          terraform validate
        continue-on-error: true

      # ── 7. Commit & push the scaffolded service ───────────────────────────
      - name: Commit and push
        run: |
          git config user.name  "port-bot"
          git config user.email "port-bot@getport.io"
          git checkout -b "service/${{ inputs.service_name }}"
          git add services/${{ inputs.service_name }}
          git commit -m "feat: scaffold service ${{ inputs.service_name }} via Port"
          git push origin "service/${{ inputs.service_name }}"
          echo "✅ Branch pushed: service/${{ inputs.service_name }}"

      # ── 8. Register the new Service entity in Port ────────────────────────
      - name: Register Service entity in Port
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: U https://api.getport.io
          operation: UPSERT
          identifier: ${{ inputs.service_name }}
          title: ${{ inputs.service_name }}
          blueprint: service

      # ── 9. Report success to Port ─────────────────────────────────────────
      - name: Notify Port — Success
        if: success()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ fromJson(inputs.port_context).runId }}
          logMessage: "✅ Service '${{ inputs.service_name }}' created successfully! Branch: service/${{ inputs.service_name }}"
          status: SUCCESS

      # ── 10. Report failure to Port ────────────────────────────────────────
      - name: Notify Port — Failure
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ fromJson(inputs.port_context).runId }}
          logMessage: "❌ Failed to create service '${{ inputs.service_name }}'. Check the workflow logs."
          status: FAILURE
