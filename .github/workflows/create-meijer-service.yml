name: Create Meijer Service

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: 'Name of the new service'
        required: true
        type: string
      frontend:
        description: 'Frontend technology'
        required: true
        type: string
      backend:
        description: 'Backend technology'
        required: true
        type: string
      database_type:
        description: 'Database type'
        required: true
        type: string
      containerization:
        description: 'Containerization platform'
        required: true
        type: string
      terraform_template:
        description: 'Terraform template entity identifier'
        required: true
        type: string
      port_context:
        description: 'Port trigger context (JSON)'
        required: true
        type: string

env:
  SERVICE_NAME: ${{ fromJson(inputs.port_context).inputs.service_name }}
  FRONTEND: ${{ fromJson(inputs.port_context).inputs.frontend }}
  BACKEND: ${{ fromJson(inputs.port_context).inputs.backend }}
  DATABASE_TYPE: ${{ fromJson(inputs.port_context).inputs.database_type }}
  CONTAINERIZATION: ${{ fromJson(inputs.port_context).inputs.containerization }}
  TERRAFORM_TEMPLATE: ${{ fromJson(inputs.port_context).inputs.terraform_template }}
  RUN_ID: ${{ fromJson(inputs.port_context).runId }}

jobs:
  create-service:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # ── 1. Report "In Progress" to Port ──────────────────────────────────
      - name: Notify Port — In Progress
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.port.io
          operation: PATCH_RUN
          runId: ${{ env.RUN_ID }}
          logMessage: "🚀 Starting service creation for '${{ env.SERVICE_NAME }}'..."
          # status: IN_PROGRESS  # Port only accepts SUCCESS or FAILURE

      # ── 2. Checkout the repo ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4


      # ── DEBUG: Print all inputs ──────────────────────────────────────────
      - name: Debug inputs
        run: |
          echo "=== Raw inputs ==="
          echo "service_name:      '${{ env.SERVICE_NAME }}'"
          echo "frontend:          '${{ env.FRONTEND }}'"
          echo "backend:           '${{ env.BACKEND }}'"
          echo "terraform_template:'${{ env.TERRAFORM_TEMPLATE }}'"
          echo "=== Port context ==="
          echo '${{ inputs.port_context }}' | python3 -m json.tool || echo "(not valid JSON)"

      # ── 3. Set up tooling based on backend choice ─────────────────────────
      - name: Set up Python
        if: ${{ inputs.backend == 'Python' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET
        if: ${{ inputs.backend == '.NET Web API' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Java
        if: ${{ inputs.backend == 'Java' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── 4. Scaffold the service directory structure ───────────────────────
      - name: Scaffold service
        run: |
          SERVICE_DIR="services/${{ env.SERVICE_NAME }}"
          mkdir -p "$SERVICE_DIR"/{src,tests,infra}

          cat > "$SERVICE_DIR/README.md" <<EOF
          # ${{ env.SERVICE_NAME }}

          | Property | Value |
          |---|---|
          | **Frontend** | ${{ env.FRONTEND }} |
          | **Backend** | ${{ env.BACKEND }} |
          | **Database** | ${{ env.DATABASE_TYPE }} |
          | **Containerization** | ${{ env.CONTAINERIZATION }} |
          | **Terraform Template** | ${{ env.TERRAFORM_TEMPLATE }} |

          > Generated by Port self-service action.
          EOF

          echo "✅ Scaffolded $SERVICE_DIR"

      # ── 5. Generate Dockerfile / Kubernetes manifest ──────────────────────
      - name: Generate container config
        run: |
          SERVICE_DIR="services/${{ env.SERVICE_NAME }}"

          # ── Resolve base Docker image by backend ──
          case "${{ env.BACKEND }}" in
            "Python")       BASE_IMAGE="python:3.12-slim";    CMD='["python", "main.py"]' ;;
            ".NET Web API") BASE_IMAGE="mcr.microsoft.com/dotnet/aspnet:8.0"; CMD='["dotnet", "app.dll"]' ;;
            "Java")         BASE_IMAGE="eclipse-temurin:21-jre-alpine"; CMD='["java", "-jar", "app.jar"]' ;;
            *)              BASE_IMAGE="ubuntu:24.04";        CMD='["/bin/sh"]' ;;
          esac

          if [ "${{ env.CONTAINERIZATION }}" == "Docker" ] || [ "${{ env.CONTAINERIZATION }}" == "Podman" ]; then
            cat > "$SERVICE_DIR/Dockerfile" <<EOF
          FROM $BASE_IMAGE
          WORKDIR /app
          COPY src/ .
          EXPOSE 8080
          CMD $CMD
          EOF
            echo "✅ Dockerfile generated (base: $BASE_IMAGE)"
          fi

          if [ "${{ env.CONTAINERIZATION }}" == "Kubernetes" ]; then
            cat > "$SERVICE_DIR/infra/deployment.yaml" <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${{ env.SERVICE_NAME }}
            labels:
              app: ${{ env.SERVICE_NAME }}
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: ${{ env.SERVICE_NAME }}
            template:
              metadata:
                labels:
                  app: ${{ env.SERVICE_NAME }}
              spec:
                containers:
                  - name: ${{ env.SERVICE_NAME }}
                    image: ${{ env.SERVICE_NAME }}:latest
                    ports:
                      - containerPort: 8080
                    resources:
                      requests:
                        cpu: "100m"
                        memory: "128Mi"
                      limits:
                        cpu: "500m"
                        memory: "512Mi"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${{ env.SERVICE_NAME }}
          spec:
            selector:
              app: ${{ env.SERVICE_NAME }}
            ports:
              - port: 80
                targetPort: 8080
            type: ClusterIP
          EOF
            echo "✅ Kubernetes manifests generated"
          fi

      # ── 6. Generate Terraform config inline ─────────────────────────────────
      - name: Generate Terraform config from template
        env:
          TEMPLATE_ID: ${{ env.TERRAFORM_TEMPLATE }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
        run: |
          SERVICE_INFRA="services/${SERVICE_NAME}/infra/terraform"
          mkdir -p "$SERVICE_INFRA"

          if [[ "$TEMPLATE_ID" == aws-* ]]; then
            CLOUD="AWS"
            printf 'terraform {\n  required_version = ">=1.3.0"\n  required_providers {\n    aws = { source = "hashicorp/aws", version = "~> 5.0" }\n  }\n}\nprovider "aws" { region = var.aws_region }\n' > "$SERVICE_INFRA/main.tf"
            printf 'variable "aws_region"             { type = string; default = "us-east-1" }\nvariable "environment"            { type = string; default = "dev" }\nvariable "team"                   { type = string; default = "platform" }\nvariable "port_entity_identifier" { type = string; default = "" }\n' > "$SERVICE_INFRA/variables.tf"
          elif [[ "$TEMPLATE_ID" == azure-* ]]; then
            CLOUD="Azure"
            printf 'terraform {\n  required_version = ">=1.3.0"\n  required_providers {\n    azurerm = { source = "hashicorp/azurerm", version = "~> 3.90" }\n  }\n}\nprovider "azurerm" { features {} }\n' > "$SERVICE_INFRA/main.tf"
            printf 'variable "location"               { type = string; default = "eastus" }\nvariable "environment"            { type = string; default = "dev" }\nvariable "team"                   { type = string; default = "platform" }\nvariable "port_entity_identifier" { type = string; default = "" }\n' > "$SERVICE_INFRA/variables.tf"
          else
            CLOUD="Unknown"
            printf '# Placeholder — unknown template: %s\n' "$TEMPLATE_ID" > "$SERVICE_INFRA/main.tf"
          fi

          printf 'environment            = "dev"\nteam                   = "platform"\nport_entity_identifier = "%s"\n' "$SERVICE_NAME" > "$SERVICE_INFRA/service.auto.tfvars"
          echo "✅ Terraform config generated for template '$TEMPLATE_ID' ($CLOUD)"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Validate
        working-directory: services/${{ env.SERVICE_NAME }}/infra/terraform
        run: |
          terraform init -backend=false
          terraform validate
        continue-on-error: true

      # ── 7. Commit & push the scaffolded service ───────────────────────────
      - name: Commit and push
        run: |
          git config user.name  "port-bot"
          git config user.email "port-bot@getport.io"
          git checkout -b "service/${{ env.SERVICE_NAME }}"
          git add services/${{ env.SERVICE_NAME }}
          git commit -m "feat: scaffold service ${{ env.SERVICE_NAME }} via Port

          - Frontend:  ${{ env.FRONTEND }}
          - Backend:   ${{ env.BACKEND }}
          - Database:  ${{ env.DATABASE_TYPE }}
          - Container: ${{ env.CONTAINERIZATION }}
          - Terraform: ${{ env.TERRAFORM_TEMPLATE }}"
          git push origin "service/${{ env.SERVICE_NAME }}"
          echo "✅ Branch pushed: service/${{ env.SERVICE_NAME }}"

      # ── 8. Register the new Service entity in Port ────────────────────────
      - name: Register Service entity in Port
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.port.io
          operation: UPSERT
          identifier: ${{ env.SERVICE_NAME }}
          title: ${{ env.SERVICE_NAME }}
          blueprint: service
          properties: |
            {
              "frontend": "${{ env.FRONTEND }}",
              "backend": "${{ env.BACKEND }}",
              "database_type": "${{ env.DATABASE_TYPE }}",
              "containerization": "${{ env.CONTAINERIZATION }}"
            }
          relations: |
            {
              "terraform_template": "${{ env.TERRAFORM_TEMPLATE }}"
            }

      # ── 9. Report success to Port ─────────────────────────────────────────
      - name: Notify Port — Success
        if: success()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.port.io
          operation: PATCH_RUN
          runId: ${{ env.RUN_ID }}
          logMessage: "✅ Service '${{ env.SERVICE_NAME }}' created successfully! Branch: service/${{ env.SERVICE_NAME }}"
          status: SUCCESS

      # ── 10. Report failure to Port ────────────────────────────────────────
      - name: Notify Port — Failure
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.port.io
          operation: PATCH_RUN
          runId: ${{ env.RUN_ID }}
          logMessage: "❌ Failed to create service '${{ env.SERVICE_NAME }}'. Check the workflow logs."
          status: FAILURE
