name: Create Meijer Service

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: 'Name of the new service'
        required: true
        type: string
      frontend:
        description: 'Frontend technology'
        required: true
        type: string
      backend:
        description: 'Backend technology'
        required: true
        type: string
      database_type:
        description: 'Database type'
        required: true
        type: string
      containerization:
        description: 'Containerization platform'
        required: true
        type: string
      terraform_template:
        description: 'Terraform template entity identifier'
        required: true
        type: string
      port_context:
        description: 'Port trigger context (JSON)'
        required: true
        type: string
      run_id:
        description: 'Port run ID'
        required: false
        type: string

jobs:
  create-service:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # ── 0. Extract all inputs from Port context at runtime ────────────────
      - name: Extract Port context
        id: ctx
        env:
          IN_SERVICE_NAME: ${{ inputs.service_name }}
          IN_FRONTEND: ${{ inputs.frontend }}
          IN_BACKEND: ${{ inputs.backend }}
          IN_DATABASE_TYPE: ${{ inputs.database_type }}
          IN_CONTAINERIZATION: ${{ inputs.containerization }}
          IN_TERRAFORM_TEMPLATE: ${{ inputs.terraform_template }}
          IN_PORT_CONTEXT: ${{ inputs.port_context }}
          IN_RUN_ID: ${{ inputs.run_id }}
        run: |
          # Strip literal "null" strings Port sends when a value is empty
          strip_null() { [ "$1" = "null" ] && echo "" || echo "$1"; }

          echo "service_name=$(strip_null "$IN_SERVICE_NAME")"               >> $GITHUB_OUTPUT
          echo "frontend=$(strip_null "$IN_FRONTEND")"                       >> $GITHUB_OUTPUT
          echo "backend=$(strip_null "$IN_BACKEND")"                         >> $GITHUB_OUTPUT
          echo "database_type=$(strip_null "$IN_DATABASE_TYPE")"             >> $GITHUB_OUTPUT
          echo "containerization=$(strip_null "$IN_CONTAINERIZATION")"       >> $GITHUB_OUTPUT
          echo "terraform_template=$(strip_null "$IN_TERRAFORM_TEMPLATE")"   >> $GITHUB_OUTPUT
          RUN_ID="$IN_RUN_ID"
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            RUN_ID="$(echo "$IN_PORT_CONTEXT" | jq -r '.runId // .run.id // empty')"
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

          echo "--- Extracted values ---"
          cat $GITHUB_OUTPUT

      # ── 1. Report start to Port ───────────────────────────────────────────
      - name: Notify Port — In Progress
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.port.io
          operation: PATCH_RUN
          runId: ${{ steps.ctx.outputs.run_id }}
          logMessage: "Starting service creation for '${{ steps.ctx.outputs.service_name }}'..."
          # status: IN_PROGRESS  # Port only accepts SUCCESS or FAILURE

      # ── 2. Checkout the repo ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 3. Set up tooling based on backend ───────────────────────────────
      - name: Set up Python
        if: steps.ctx.outputs.backend == 'Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET
        if: steps.ctx.outputs.backend == '.NET Web API'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Java
        if: steps.ctx.outputs.backend == 'Java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── 4. Scaffold service directory ─────────────────────────────────────
      - name: Scaffold service
        env:
          SVC: ${{ steps.ctx.outputs.service_name }}
          FRONTEND: ${{ steps.ctx.outputs.frontend }}
          BACKEND: ${{ steps.ctx.outputs.backend }}
          DB: ${{ steps.ctx.outputs.database_type }}
          CONTAINER: ${{ steps.ctx.outputs.containerization }}
          TF_TEMPLATE: ${{ steps.ctx.outputs.terraform_template }}
        run: |
          mkdir -p "services/${SVC}"/{src,tests,infra}
          cat > "services/${SVC}/README.md" << EOF
          # ${SVC}

          | Property | Value |
          |---|---|
          | **Frontend** | ${FRONTEND} |
          | **Backend** | ${BACKEND} |
          | **Database** | ${DB} |
          | **Containerization** | ${CONTAINER} |
          | **Terraform Template** | ${TF_TEMPLATE} |

          > Generated by Port self-service action.
          EOF
          echo "Scaffolded services/${SVC}"

      # ── 5. Generate container config ──────────────────────────────────────
      - name: Generate container config
        env:
          SVC: ${{ steps.ctx.outputs.service_name }}
          BACKEND: ${{ steps.ctx.outputs.backend }}
          CONTAINER: ${{ steps.ctx.outputs.containerization }}
        run: |
          case "$BACKEND" in
            "Python")       BASE_IMAGE="python:3.12-slim"                      ; CMD='["python", "main.py"]' ;;
            ".NET Web API") BASE_IMAGE="mcr.microsoft.com/dotnet/aspnet:8.0"   ; CMD='["dotnet", "app.dll"]' ;;
            "Java")         BASE_IMAGE="eclipse-temurin:21-jre-alpine"         ; CMD='["java", "-jar", "app.jar"]' ;;
            *)              BASE_IMAGE="ubuntu:24.04"                          ; CMD='["/bin/sh"]' ;;
          esac

          if [ "$CONTAINER" = "Docker" ] || [ "$CONTAINER" = "Podman" ]; then
            printf 'FROM %s\nWORKDIR /app\nCOPY src/ .\nEXPOSE 8080\nCMD %s\n' \
              "$BASE_IMAGE" "$CMD" > "services/${SVC}/Dockerfile"
            echo "Dockerfile generated (base: $BASE_IMAGE)"
          fi

          if [ "$CONTAINER" = "Kubernetes" ]; then
            mkdir -p "services/${SVC}/infra"
            printf 'apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: %s\n  labels:\n    app: %s\nspec:\n  replicas: 2\n  selector:\n    matchLabels:\n      app: %s\n  template:\n    metadata:\n      labels:\n        app: %s\n    spec:\n      containers:\n        - name: %s\n          image: %s:latest\n          ports:\n            - containerPort: 8080\n          resources:\n            requests:\n              cpu: "100m"\n              memory: "128Mi"\n            limits:\n              cpu: "500m"\n              memory: "512Mi"\n' \
              "$SVC" "$SVC" "$SVC" "$SVC" "$SVC" "$SVC" > "services/${SVC}/infra/deployment.yaml"
            printf '---\napiVersion: v1\nkind: Service\nmetadata:\n  name: %s\nspec:\n  selector:\n    app: %s\n  ports:\n    - port: 80\n      targetPort: 8080\n  type: ClusterIP\n' \
              "$SVC" "$SVC" >> "services/${SVC}/infra/deployment.yaml"
            echo "Kubernetes manifests generated"
          fi

      # ── 6. Generate Terraform config ──────────────────────────────────────
      - name: Generate Terraform config
        env:
          SVC: ${{ steps.ctx.outputs.service_name }}
          TF_TEMPLATE: ${{ steps.ctx.outputs.terraform_template }}
        run: |
          INFRA="services/${SVC}/infra/terraform"
          mkdir -p "$INFRA"

          if [[ "$TF_TEMPLATE" == aws-* ]]; then
            printf 'terraform {\n  required_version = ">=1.3.0"\n  required_providers {\n    aws = { source = "hashicorp/aws", version = "~> 5.0" }\n  }\n}\nprovider "aws" { region = var.aws_region }\n' > "$INFRA/main.tf"
            printf 'variable "aws_region"             { type = string; default = "us-east-1" }\nvariable "environment"            { type = string; default = "dev" }\nvariable "team"                   { type = string; default = "platform" }\nvariable "port_entity_identifier" { type = string; default = "" }\n' > "$INFRA/variables.tf"
            echo "Generated AWS Terraform config"
          elif [[ "$TF_TEMPLATE" == azure-* ]]; then
            printf 'terraform {\n  required_version = ">=1.3.0"\n  required_providers {\n    azurerm = { source = "hashicorp/azurerm", version = "~> 3.90" }\n  }\n}\nprovider "azurerm" { features {} }\n' > "$INFRA/main.tf"
            printf 'variable "location"               { type = string; default = "eastus" }\nvariable "environment"            { type = string; default = "dev" }\nvariable "team"                   { type = string; default = "platform" }\nvariable "port_entity_identifier" { type = string; default = "" }\n' > "$INFRA/variables.tf"
            echo "Generated Azure Terraform config"
          else
            printf '# Unknown template: %s\n' "$TF_TEMPLATE" > "$INFRA/main.tf"
            echo "Unknown template '$TF_TEMPLATE' — created placeholder"
          fi

          printf 'environment            = "dev"\nteam                   = "platform"\nport_entity_identifier = "%s"\n' "$SVC" > "$INFRA/service.auto.tfvars"

      # ── 7. Terraform init & validate ──────────────────────────────────────
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Validate
        env:
          SVC: ${{ steps.ctx.outputs.service_name }}
        working-directory: services/${{ steps.ctx.outputs.service_name }}/infra/terraform
        run: |
          terraform init -backend=false
          terraform validate
        continue-on-error: true

      # ── 8. Commit & push ──────────────────────────────────────────────────
      - name: Commit and push
        env:
          SVC: ${{ steps.ctx.outputs.service_name }}
          FRONTEND: ${{ steps.ctx.outputs.frontend }}
          BACKEND: ${{ steps.ctx.outputs.backend }}
          DB: ${{ steps.ctx.outputs.database_type }}
          CONTAINER: ${{ steps.ctx.outputs.containerization }}
          TF_TEMPLATE: ${{ steps.ctx.outputs.terraform_template }}
        run: |
          if [ -z "$SVC" ] || [ "$SVC" = "null" ]; then
            echo "ERROR: service_name is empty or null. Check the Extract Port context step."
            exit 1
          fi
          git config user.name  "port-bot"
          git config user.email "port-bot@getport.io"
          git checkout -b "service/${SVC}"
          git add "services/${SVC}"
          git commit -m "feat: scaffold ${SVC} via Port" \
            -m "Frontend: ${FRONTEND} | Backend: ${BACKEND} | DB: ${DB} | Container: ${CONTAINER} | TF: ${TF_TEMPLATE}"
          git push --force-with-lease origin "service/${SVC}"
          echo "Branch pushed: service/${SVC}"

      # ── 9. Register Service entity in Port ────────────────────────────────
      - name: Register Service entity in Port
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.port.io
          operation: UPSERT
          identifier: ${{ steps.ctx.outputs.service_name }}
          title: ${{ steps.ctx.outputs.service_name }}
          blueprint: service
          properties: |
            {
              "frontend": "${{ steps.ctx.outputs.frontend }}",
              "backend": "${{ steps.ctx.outputs.backend }}",
              "database_type": "${{ steps.ctx.outputs.database_type }}",
              "containerization": "${{ steps.ctx.outputs.containerization }}"
            }
          # Uncomment once a 'terraform_template' relation exists on the 'service' blueprint:
          # relations: |
          #   { "terraform_template": "${{ steps.ctx.outputs.terraform_template }}" }

      # ── 10. Notify Port — Success ─────────────────────────────────────────
      - name: Notify Port — Success
        if: success()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.port.io
          operation: PATCH_RUN
          runId: ${{ steps.ctx.outputs.run_id }}
          logMessage: "Service '${{ steps.ctx.outputs.service_name }}' created! Branch: service/${{ steps.ctx.outputs.service_name }}"
          status: SUCCESS

      # ── 11. Notify Port — Failure ─────────────────────────────────────────
      - name: Notify Port — Failure
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.port.io
          operation: PATCH_RUN
          runId: ${{ steps.ctx.outputs.run_id }}
          logMessage: "Failed to create service '${{ steps.ctx.outputs.service_name }}'. Check workflow logs."
          status: FAILURE
