name: Launch Workstation

on:
  workflow_dispatch:
    inputs:
      workstation_name:
        description: "Unique workstation name"
        required: true
        type: string
      workstation_config_entity:
        description: "Port entity identifier of the workstation config"
        required: true
        type: string
      team:
        description: "Team name (for audit/labelling)"
        required: true
        type: string
      port_run_id:
        description: "Port action run ID"
        required: true
        type: string
      triggered_by:
        description: "Email of triggering user"
        required: false
        type: string

jobs:
  launch-workstation:
    name: Launch GCP Workstation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      # ── 1. Notify Port: in progress ──────────────────────────────────────
      - name: Notify Port – In Progress
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          logMessage: "Resolving workstation config '${{ inputs.workstation_config_entity }}'..."

      # ── 2. Authenticate to GCP via Workload Identity Federation ────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # ── 3. Resolve config properties from Port entity ─────────────────────
      - name: Fetch Workstation Config entity from Port
        id: fetch_config
        shell: python3 {0}
        env:
          ENTITY_ID: ${{ inputs.workstation_config_entity }}
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
        run: |
          import json, os, sys, urllib.request

          client_id     = os.environ["PORT_CLIENT_ID"]
          client_secret = os.environ["PORT_CLIENT_SECRET"]
          entity_raw    = os.environ["ENTITY_ID"]
          base_url      = "https://api.getport.io/v1"

          # Port may pass the full entity object or just the identifier string
          try:
              entity_obj = json.loads(entity_raw)
              entity_id  = entity_obj.get("identifier", entity_raw)
          except (json.JSONDecodeError, AttributeError):
              entity_id  = entity_raw.strip()

          auth_payload = json.dumps({"clientId": client_id, "clientSecret": client_secret}).encode()
          req = urllib.request.Request(
              f"{base_url}/auth/access_token",
              data=auth_payload,
              headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req) as r:
              token = json.loads(r.read())["accessToken"]

          req2 = urllib.request.Request(
              f"{base_url}/blueprints/gcp_workstation_config/entities/{entity_id}",
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
          with urllib.request.urlopen(req2) as r:
              data = json.loads(r.read())

          props     = data["entity"]["properties"]
          cluster   = props["cluster"]
          region    = props["region"]
          config_id = props["config_id"]
          status    = props.get("status", "")

          print(f"Resolved: cluster={cluster} region={region} config_id={config_id} status={status}")

          if status != "READY":
              print(f"::error::Config status is '{status}' — only READY configs can be used.")
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"cluster={cluster}\n")
              f.write(f"region={region}\n")
              f.write(f"config_id={config_id}\n")
              f.write(f"entity_id={entity_id}\n")


      # ── 4. Notify resolved config ─────────────────────────────────────────
      - name: Notify Port – Config Resolved
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          logMessage: "Config resolved: ${{ steps.fetch_config.outputs.config_id }} in ${{ steps.fetch_config.outputs.region }}. Provisioning workstation..."

      # ── 5. Create the workstation ─────────────────────────────────────────
      - name: Create Workstation
        id: create_ws
        run: |
          set -euo pipefail

          TEAM_LABEL=$(echo "${{ inputs.team }}" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd '[:alnum:]-')
          OWNER_LABEL=$(echo "${{ inputs.triggered_by }}" | tr '[:upper:]' '[:lower:]' | tr '@.' '-' | tr -cd '[:alnum:]-' | cut -c1-63)

          # Check if workstation already exists
          if gcloud workstations describe "${{ inputs.workstation_name }}" \
              --cluster="${{ steps.fetch_config.outputs.cluster }}" \
              --config="${{ steps.fetch_config.outputs.config_id }}" \
              --region="${{ steps.fetch_config.outputs.region }}" \
              --project="${{ secrets.GCP_PROJECT_ID }}" \
              --format=json 2>/dev/null | tee /tmp/ws_output.json; then
            echo "Workstation '${{ inputs.workstation_name }}' already exists — skipping creation."
          else
            echo "Creating workstation '${{ inputs.workstation_name }}'..."
            gcloud workstations create "${{ inputs.workstation_name }}" \
              --cluster="${{ steps.fetch_config.outputs.cluster }}" \
              --config="${{ steps.fetch_config.outputs.config_id }}" \
              --region="${{ steps.fetch_config.outputs.region }}" \
              --project="${{ secrets.GCP_PROJECT_ID }}" \
              --labels="team=${TEAM_LABEL},created-by=port,owner=${OWNER_LABEL}" \
              --format=json \
              --quiet | tee /tmp/ws_output.json
          fi

          WS_HOST=$(jq -r '.host // ""' /tmp/ws_output.json)
          if [ -n "$WS_HOST" ]; then
            echo "ws_url=https://$WS_HOST" >> $GITHUB_OUTPUT
          else
            echo "ws_url=" >> $GITHUB_OUTPUT
          fi

      # ── 6. Verify workstation exists and get URL ─────────────────────────
      - name: Verify Workstation and Get URL
        id: final_url
        run: |
          set -euo pipefail

          WS_JSON=$(gcloud workstations describe "${{ inputs.workstation_name }}" \
            --cluster="${{ steps.fetch_config.outputs.cluster }}" \
            --config="${{ steps.fetch_config.outputs.config_id }}" \
            --region="${{ steps.fetch_config.outputs.region }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --format=json 2>/dev/null || echo "{}")

          HOST=$(echo "$WS_JSON" | jq -r '.host // ""')
          STATE=$(echo "$WS_JSON" | jq -r '.state // "STOPPED"' | sed 's/STATE_//')

          if [ -n "$HOST" ]; then
            echo "ws_url=https://$HOST" >> $GITHUB_OUTPUT
          else
            echo "ws_url=" >> $GITHUB_OUTPUT
          fi

          echo "ws_state=$STATE" >> $GITHUB_OUTPUT
          echo "Workstation exists with state: $STATE"
          echo "URL: https://$HOST" 

      # ── 8. Upsert Port workstation entity ─────────────────────────────────
      - name: Create Port Workstation Entity
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: UPSERT
          identifier: ${{ inputs.workstation_name }}
          title: ${{ inputs.workstation_name }}
          blueprint: gcp_workstation
          runId: ${{ inputs.port_run_id }}
          relations: |
            {
              "workstation_config": "${{ steps.fetch_config.outputs.entity_id }}"
            }
          properties: |
            {
              "workstation_id": "${{ inputs.workstation_name }}",
              "cluster": "${{ steps.fetch_config.outputs.cluster }}",
              "region": "${{ steps.fetch_config.outputs.region }}",
              "config": "${{ steps.fetch_config.outputs.config_id }}",
              "status": "${{ steps.final_url.outputs.ws_state }}",
              "workstation_url": "${{ steps.final_url.outputs.ws_url }}",
              "created_by": "${{ inputs.triggered_by }}",
              "project_id": "${{ secrets.GCP_PROJECT_ID }}"
            }

      # ── 9. Report success ─────────────────────────────────────────────────
      - name: Notify Port – Success
        if: success()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          status: "SUCCESS"
          logMessage: |
            ✅ Workstation '${{ inputs.workstation_name }}' created successfully.
            Config: ${{ steps.fetch_config.outputs.config_id }} | Team: ${{ inputs.team }}
            URL: ${{ steps.final_url.outputs.ws_url }}

      # ── 10. Report failure ────────────────────────────────────────────────
      - name: Notify Port – Failure
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          status: "FAILURE"
          logMessage: "❌ Failed to launch workstation '${{ inputs.workstation_name }}'. Check Actions logs."
